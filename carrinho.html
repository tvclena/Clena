<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Carrinho</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet"><style>
:root{
 --primary:#2563eb;--accent:#0f172a;--bg:#f6f8fc;--card:#fff;--text:#0f172a;--muted:#64748b;
 --line:color-mix(in srgb,var(--text) 11%,transparent);--shadow:0 12px 34px rgba(15,23,42,.075);
 --font-body:"Manrope",sans-serif;--font-head:"Manrope",sans-serif;--head-weight:800;--shell:1280px;--radius:18px
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
body.is-leaving{opacity:.82;transition:opacity .08s ease}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.hidden{display:none!important}
.shell{width:min(var(--shell),calc(100% - 34px));margin-inline:auto}
h1,h2,h3,h4,strong{font-family:var(--font-head);font-weight:var(--head-weight)}
.site-header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.header-inner{height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);display:grid;place-items:center;flex:none}.logo img{width:100%;height:100%;object-fit:cover}
.brand-copy{display:grid;min-width:0}.brand-copy strong{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-copy small{font-size:.62rem;color:var(--muted)}
.header-actions{display:flex;gap:7px}.icon-button{width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:11px;color:var(--text);display:grid;place-items:center;position:relative}
.cart-count{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--primary);color:white;font-size:.57rem;font-weight:900;display:grid;place-items:center}
.btn{border:0;min-height:42px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800;border-radius:11px}
.btn-primary{background:var(--primary);color:white}.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}
.footer{margin-top:58px;background:var(--accent);color:white;padding:34px 0}.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}.footer p{margin:5px 0 0;opacity:.7;font-size:.72rem}
.notice{position:fixed;z-index:500;right:16px;top:16px;background:#111827;color:white;padding:11px 14px;border-radius:11px;box-shadow:0 18px 45px rgba(0,0,0,.2);font-size:.76rem;max-width:min(360px,calc(100vw - 32px))}
.skeleton{background:linear-gradient(90deg,color-mix(in srgb,var(--text) 5%,var(--card)),color-mix(in srgb,var(--text) 9%,var(--card)),color-mix(in srgb,var(--text) 5%,var(--card)));background-size:220% 100%;animation:sk 1.1s linear infinite}@keyframes sk{to{background-position:-220% 0}}
@media(max-width:640px){.shell{width:min(100% - 20px,var(--shell))}.header-inner{height:60px}.brand-copy small{display:none}.footer-inner{display:grid}}

.cart-page{padding:24px 0 48px}.cart-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:16px;align-items:start}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.panel h1{margin:0;font-size:1.4rem}.panel h2{margin:0;font-size:1rem}.subtitle{margin:4px 0 0;color:var(--muted);font-size:.73rem}.items{margin-top:10px}.item{display:grid;grid-template-columns:60px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.item-image{width:60px;height:60px;border-radius:10px;overflow:hidden;background:#eef2f7}.item-image img{width:100%;height:100%;object-fit:cover}.item-top,.item-bottom{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.item h3{margin:0;font-size:.78rem}.item p,.item small{display:block;margin:3px 0 0;font-size:.61rem;color:var(--muted)}.remove{border:0;background:transparent;color:#dc2626;padding:3px}.mini-qty{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.mini-qty button{width:27px;height:27px;border:0;background:transparent;color:var(--text)}.mini-qty strong{min-width:23px;display:grid;place-items:center;font-size:.67rem}.checkout{position:sticky;top:82px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.field{display:grid;gap:4px}.field.full{grid-column:1/-1}.field span{font-size:.61rem;font-weight:800}.field input,.field select,.field textarea{width:100%;min-height:39px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);padding:8px 9px;outline:0;font-size:.74rem}.field textarea{min-height:58px;resize:vertical}.address{grid-column:1/-1}.summary{display:grid;gap:6px;margin:13px 0}.summary div{display:flex;justify-content:space-between;color:var(--muted);font-size:.73rem}.summary .total{padding-top:8px;border-top:1px solid var(--line);color:var(--text);font-size:.96rem}.warning{padding:8px 9px;border-radius:9px;background:#fff7ed;color:#9a3412;font-size:.64rem;margin:8px 0}.finish{width:100%}.empty{text-align:center;padding:55px 20px}.empty i{font-size:36px;color:var(--primary)}.empty h2{margin:11px 0 4px}.empty p{color:var(--muted);font-size:.75rem}
@media(max-width:820px){.cart-grid{grid-template-columns:1fr}.checkout{position:relative;top:auto}}@media(max-width:480px){.fields{grid-template-columns:1fr}.field.full,.address{grid-column:1}}
</style></head><body>
<header class="site-header"><div class="header-inner shell"><a id="backStore" class="brand"><span id="logo" class="logo"><i class="ri-store-2-line"></i></span><span class="brand-copy"><strong id="storeName">Loja</strong><small>Voltar para a loja</small></span></a><div class="icon-button"><i class="ri-shopping-bag-3-line"></i><b id="cartCount" class="cart-count">0</b></div></div></header>
<main id="cartPage" class="cart-page shell"><section id="empty" class="panel empty hidden"><i class="ri-shopping-bag-line"></i><h2>Seu carrinho está vazio</h2><p>Volte para a loja e escolha seus produtos.</p><a id="emptyBack" class="btn btn-primary" onclick="document.getElementById('backStore').click();return false;">Ver produtos</a></section><div id="cartGrid" class="cart-grid"><section class="panel"><h1>Seu carrinho</h1><p class="subtitle">Revise os produtos antes de finalizar.</p><div id="items" class="items"></div></section><aside class="panel checkout"><h2>Finalizar pedido</h2><div class="fields"><label class="field"><span>Nome</span><input id="customerName" autocomplete="name"></label><label class="field"><span>WhatsApp</span><input id="customerPhone" inputmode="tel" autocomplete="tel"></label><label class="field full"><span>Entrega / retirada</span><select id="fee"></select></label><div id="address" class="address hidden"><div class="fields"><label class="field"><span>Rua</span><input id="street"></label><label class="field"><span>Número</span><input id="number"></label><label class="field"><span>Bairro</span><input id="neighborhood"></label><label class="field"><span>Cidade</span><input id="city"></label><label class="field"><span>UF</span><input id="state" maxlength="2"></label><label class="field"><span>CEP</span><input id="zip"></label></div></div><label class="field full"><span>Pagamento</span><select id="payment"></select></label><label class="field full"><span>Observações</span><textarea id="notes"></textarea></label></div><div class="summary"><div><span>Subtotal</span><strong id="subtotal"></strong></div><div><span>Entrega</span><strong id="feeTotal"></strong></div><div class="total"><span>Total</span><strong id="total"></strong></div></div><div id="warning" class="warning hidden"></div><button id="finish" class="btn btn-primary finish">Finalizar pelo WhatsApp <i class="ri-whatsapp-line"></i></button></aside></div></main>
<footer class="footer"><div class="footer-inner shell"><div><strong id="footerName">Loja</strong><p>Pedido seguro e organizado.</p></div><small>Feito com CLENA</small></div></footer><script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const $=id=>document.getElementById(id);
const $$=(q,r=document)=>[...r.querySelectorAll(q)];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const digits=v=>String(v||'').replace(/\D/g,'');
const params=new URLSearchParams(location.search);

function getSlug(){
  const q=params.get('slug'); if(q)return q;
  const p=location.pathname.split('/').filter(Boolean);
  const roots=['loja','produto','carrinho'];
  const i=p.findIndex(x=>roots.includes(x));
  return i>=0?p[i+1]||'':'';
}
function getProductId(){
  const q=params.get('id');if(q)return q;
  const p=location.pathname.split('/').filter(Boolean);
  const i=p.indexOf('produto');
  return i>=0?p[i+2]||'':'';
}
async function dbClient(){
 const r=await fetch('/api/public-config',{headers:{Accept:'application/json'},cache:'no-store'});
 if(!r.ok)throw new Error('Configuração pública indisponível.');
 const c=await r.json();if(!c.supabaseUrl||!c.supabaseAnonKey)throw new Error('Supabase não configurado.');
 return createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
}
async function fetchStore(db,slug){
 const {data,error}=await db.from('stores').select('*').eq('slug',slug).eq('is_published',true).maybeSingle();
 if(error)throw error;if(!data)throw new Error('Loja não encontrada ou não publicada.');return data;
}
function productPrice(p){const s=Number(p.sale_price||0),n=Number(p.price||0);return s>0&&s<n?s:n}
function onSale(p){return Number(p.sale_price||0)>0&&Number(p.sale_price)<Number(p.price||0)}
function cartKey(id){return `clena_public_cart_${id}`}
function readCart(id){try{return JSON.parse(localStorage.getItem(cartKey(id))||'[]')}catch{return[]}}
function saveCart(id,v){localStorage.setItem(cartKey(id),JSON.stringify(v))}
function countCart(v){return v.reduce((a,x)=>a+Number(x.quantity||0),0)}
function toast(msg){const n=document.createElement('div');n.className='notice';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}
function routeStore(s){return `/loja/${encodeURIComponent(s)}`}
function routeProduct(s,id){return `/produto/${encodeURIComponent(s)}/${encodeURIComponent(id)}`}
function routeCart(s){return `/carrinho/${encodeURIComponent(s)}`}
function applyTheme(store){
 const a=store.appearance_settings||{};
 const r=document.documentElement.style;
 r.setProperty('--primary',store.primary_color||'#2563eb');r.setProperty('--accent',store.accent_color||'#0f172a');
 r.setProperty('--bg',a.background_color||'#f6f8fc');r.setProperty('--card',a.card_color||'#fff');r.setProperty('--text',a.text_color||'#0f172a');r.setProperty('--muted',a.muted_color||'#64748b');
 r.setProperty('--font-body',`"${a.body_font||'Manrope'}",sans-serif`);r.setProperty('--font-head',`"${a.heading_font||a.body_font||'Manrope'}",sans-serif`);r.setProperty('--head-weight',a.heading_weight||800);
 document.body.dataset.button=a.button_style||'rounded';document.body.dataset.category=a.category_style||'pills';document.body.dataset.radius=a.card_radius||'large';
}
function setChrome(store){
 document.title=store.name||'Loja';$('storeName').textContent=store.name||'Loja';$('footerName').textContent=store.name||'Loja';
 $('logo').innerHTML=store.logo_url?`<img src="${esc(store.logo_url)}" alt="${esc(store.name)}">`:'<i class="ri-store-2-line"></i>';
 const c=$('cartCount');if(c)c.textContent=countCart(readCart(store.id));
}

let db,store,cart=[],fees=[],selectedFee=null;
function unit(x){return productPrice(x.product)+Number(x.variation?.price_adjustment||0)}
function subtotal(){return cart.reduce((a,x)=>a+unit(x)*Number(x.quantity||0),0)}
function feeValue(){return Number(selectedFee?.fee||0)}
function minOrder(){return Math.max(Number(store.minimum_order||0),Number(selectedFee?.minimum_order||0))}
function persist(){saveCart(store.id,cart);setChrome(store);render()}
function render(){
 $('items').innerHTML=cart.map((x,i)=>`<article class="item"><div class="item-image">${x.product.image_url?`<img src="${esc(x.product.image_url)}" alt="">`:''}</div><div><div class="item-top"><div><h3>${esc(x.product.name)}</h3>${x.variation?`<p>${esc(x.variation.name)}</p>`:''}${x.note?`<small>Obs.: ${esc(x.note)}</small>`:''}</div><button class="remove" data-remove="${i}"><i class="ri-delete-bin-line"></i></button></div><div class="item-bottom"><div class="mini-qty"><button data-d="-1" data-i="${i}">−</button><strong>${x.quantity}</strong><button data-d="1" data-i="${i}">+</button></div><strong>${money(unit(x)*x.quantity)}</strong></div></div></article>`).join('');
 const empty=!cart.length;$('empty').classList.toggle('hidden',!empty);$('cartGrid').classList.toggle('hidden',empty);
 const s=subtotal(),f=feeValue(),m=minOrder();$('subtotal').textContent=money(s);$('feeTotal').textContent=selectedFee?(f?money(f):'Grátis'):'—';$('total').textContent=money(s+f);const under=m>0&&s<m;$('warning').classList.toggle('hidden',!under);$('warning').textContent=under?`Faltam ${money(m-s)} para atingir o pedido mínimo.`:'';$('finish').disabled=under;
 $$('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.remove),1);persist()});$$('[data-d]').forEach(b=>b.onclick=()=>{const x=cart[Number(b.dataset.i)];x.quantity+=Number(b.dataset.d);if(x.quantity<1)cart.splice(Number(b.dataset.i),1);persist()});
}
function validate(){
 const n=$('customerName').value.trim(),p=$('customerPhone').value.trim();if(!n)throw new Error('Informe seu nome.');if(digits(p).length<8)throw new Error('Informe um WhatsApp válido.');if(fees.length&&!selectedFee)throw new Error('Escolha entrega ou retirada.');return {n,p}
}
function checkout(){
 try{
  const c=validate();if(!digits(store.whatsapp))throw new Error('A loja não configurou WhatsApp.');
  const lines=[`Olá! Quero fazer um pedido na *${store.name}*.`,'',`*Cliente:* ${c.n}`,`*WhatsApp:* ${c.p}`,'','*Itens:*'];
  cart.forEach(x=>lines.push(`• ${x.quantity}x ${x.product.name}${x.variation?` (${x.variation.name})`:''}${x.note?` — Obs.: ${x.note}`:''} — ${money(unit(x)*x.quantity)}`));
  lines.push('',`*Subtotal:* ${money(subtotal())}`);
  if(selectedFee){lines.push(`*Modalidade:* ${selectedFee.name}`,`*Taxa:* ${feeValue()?money(feeValue()):'Grátis'}`);if(selectedFee.estimated_time)lines.push(`*Prazo:* ${selectedFee.estimated_time}`)}
  const pickup=(selectedFee?.delivery_type||selectedFee?.type)==='pickup';
  if(!pickup&&selectedFee){const a=[$('street').value.trim(),$('number').value.trim(),$('neighborhood').value.trim(),$('city').value.trim(),$('state').value.trim(),$('zip').value.trim()];if(!a[0]||!a[1]||!a[2])throw new Error('Preencha rua, número e bairro.');lines.push('','*Endereço:*',`${a[0]}, ${a[1]}`,`${a[2]} — ${a[3]}/${a[4]}`,a[5]?`CEP: ${a[5]}`:'')}
  lines.push('',`*Pagamento:* ${$('payment').selectedOptions[0]?.textContent||'A combinar'}`,`*Total:* ${money(subtotal()+feeValue())}`);
  if($('notes').value.trim())lines.push(`*Observações gerais:* ${$('notes').value.trim()}`);
  if(store.order_note)lines.push('',store.order_note);window.open(`https://wa.me/${digits(store.whatsapp)}?text=${encodeURIComponent(lines.filter(Boolean).join('\n'))}`,'_blank','noopener');
 }catch(e){toast(e.message)}
}
async function init(){
 try{
  db=await dbClient();store=await fetchStore(db,getSlug());applyTheme(store);setChrome(store);$('backStore').href=routeStore(store.slug);cart=readCart(store.id);
  const {data,error}=await db.from('store_delivery_fees').select('*').eq('store_id',store.id).eq('active',true).order('position').order('created_at');if(error&&error.code!=='42P01')throw error;fees=data||[];
  $('fee').innerHTML=`<option value="">${fees.length?'Escolha uma opção':'Sem taxa cadastrada'}</option>`+fees.map(f=>`<option value="${esc(f.id)}">${esc(f.name)} — ${Number(f.fee||0)?money(f.fee):'Grátis'}${Number(f.minimum_order||0)?` • mín. ${money(f.minimum_order)}`:''}</option>`).join('');
  $('fee').onchange=()=>{selectedFee=fees.find(x=>x.id===$('fee').value)||null;const pickup=(selectedFee?.delivery_type||selectedFee?.type)==='pickup';$('address').classList.toggle('hidden',pickup||!selectedFee);render()};
  const pays=[];if(store.accepts_pix)pays.push(['pix','PIX']);if(store.accepts_card)pays.push(['card','Cartão']);if(store.accepts_cash)pays.push(['cash','Dinheiro']);if(!pays.length)pays.push(['other','A combinar']);
  $('payment').innerHTML=pays.map(([v,n])=>`<option value="${v}">${n}</option>`).join('');$('finish').onclick=checkout;render();
 }catch(e){console.error(e);$('cartPage').innerHTML=`<div class="panel empty"><h2>Não foi possível abrir o carrinho</h2><p>${esc(e.message)}</p></div>`}
}
init();
</script></body></html>
