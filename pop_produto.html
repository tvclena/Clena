<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Produto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root{
  --primary:#2563eb;--accent:#0f172a;--bg:#f6f8fc;--card:#fff;--text:#0f172a;--muted:#64748b;
  --line:rgba(15,23,42,.10);--shadow:0 12px 36px rgba(15,23,42,.08);--shell:1240px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Manrope,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}.is-hidden{display:none!important}a{text-decoration:none;color:inherit}.shell{width:min(var(--shell),calc(100% - 32px));margin:auto}
.btn{border:0;min-height:44px;padding:0 15px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff}.btn-soft{background:var(--card);border:1px solid var(--line);color:var(--text)}
.icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:grid;place-items:center;cursor:pointer}
.loader{position:fixed;inset:0;background:var(--bg);z-index:999;display:grid;place-items:center}.loader span{width:48px;height:48px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;right:18px;top:18px;z-index:1000;padding:12px 15px;border-radius:12px;background:#111827;color:white;box-shadow:var(--shadow);font-size:.82rem}
.site-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.header-inner{height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-logo{width:40px;height:40px;border-radius:11px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}.brand-logo img{width:100%;height:100%;object-fit:cover}.brand-copy{display:grid;min-width:0}.brand-copy strong{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-copy small{font-size:.65rem;color:var(--muted)}
.header-actions{display:flex;gap:8px}.cart-link{position:relative}.cart-count{position:absolute;right:-5px;top:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--primary);color:#fff;font-size:.6rem;font-weight:900;display:grid;place-items:center}
.footer{margin-top:64px;padding:34px 0;background:var(--accent);color:#fff}.footer-inner{display:flex;justify-content:space-between;gap:20px;align-items:center}.footer small{opacity:.7}
@media(max-width:640px){.shell{width:min(100% - 20px,var(--shell))}.brand-copy small{display:none}.footer-inner{display:grid}.header-inner{height:60px}}

.page{padding:26px 0 50px}.back{margin-bottom:14px}.product-shell{display:grid;grid-template-columns:minmax(330px,43%) minmax(0,1fr);gap:20px;align-items:start}.gallery{position:sticky;top:88px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}.main-media{aspect-ratio:1;border-radius:13px;overflow:hidden;background:#eef2f7;display:grid;place-items:center}.main-media img,.main-media video{width:100%;height:100%;object-fit:contain}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.thumb{aspect-ratio:1;border:2px solid transparent;border-radius:9px;overflow:hidden;padding:0;background:#eef2f7}.thumb.active{border-color:var(--primary)}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.info{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}.cat-label{font-size:.65rem;font-weight:900;color:var(--primary);text-transform:uppercase}.info h1{margin:7px 0 10px;font-size:2rem;line-height:1.08}.desc{color:var(--muted);font-size:.88rem;line-height:1.65;white-space:pre-line}.big-price{display:flex;align-items:baseline;gap:8px;margin:16px 0 20px;padding-bottom:18px;border-bottom:1px solid var(--line)}.big-price strong{font-size:1.55rem}.big-price small{text-decoration:line-through;color:var(--muted)}.section-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}.options{display:grid;gap:7px}.option{border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}.option:has(input:checked){border-color:var(--primary);background:color-mix(in srgb,var(--primary) 6%,var(--card))}.option input{accent-color:var(--primary)}textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:11px;padding:10px;resize:vertical}.buybar{position:sticky;bottom:10px;margin-top:18px;padding:10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);display:grid;grid-template-columns:110px 1fr;gap:8px}.qty{height:44px;border:1px solid var(--line);border-radius:11px;display:grid;grid-template-columns:1fr 34px 1fr;align-items:center}.qty button{height:100%;border:0;background:transparent}.qty strong{text-align:center}.recommend{margin-top:22px}.recommend-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.recommend-head h2{font-size:1.1rem;margin:0}.recommend-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.rec img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eef2f7}.rec div{padding:7px}.rec strong{display:block;font-size:.62rem;line-height:1.25}.rec span{font-size:.62rem;color:var(--primary);font-weight:800}
@media(max-width:780px){.product-shell{grid-template-columns:1fr}.gallery{position:relative;top:auto}.main-media{aspect-ratio:4/3}.info{padding:17px}.info h1{font-size:1.45rem}.recommend-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:430px){.recommend-grid{grid-template-columns:repeat(2,1fr)}}

/* CLENA V9 — navegação sutil, sem tela de carregamento */
html{background:var(--bg)}
body{
  opacity:1;
  transition:opacity .14s ease;
}
body.page-leaving{opacity:.68}
.loader{display:none!important}
.page-enter{
  animation:clenaPageEnter .18s ease both;
}
@keyframes clenaPageEnter{
  from{opacity:.88;transform:translateY(3px)}
  to{opacity:1;transform:none}
}
@media(prefers-reduced-motion:reduce){
  body,.page-enter{transition:none!important;animation:none!important}
}

/* CLENA V10 — navegação de produto previsível */
.rec{cursor:pointer}
.back{white-space:nowrap}
@media(max-width:480px){
  .back{font-size:.76rem;min-height:40px;padding-inline:12px}
}
</style></head><body><header class="site-header"><div class="header-inner shell"><a id="backLink" class="brand" href="/loja/"><span id="brandLogo" class="brand-logo"></span><span class="brand-copy"><strong id="storeName">Loja</strong><small id="storeStatus"></small></span></a><a id="cartLink" class="icon-btn cart-link" href="/carrinho/"><i class="ri-shopping-bag-3-line"></i><b id="cartCount" class="cart-count">0</b></a></div></header>
<main class="page shell page-enter"><button id="backLink2" class="btn btn-soft back" type="button" aria-label="Voltar para a loja"><i class="ri-arrow-left-line"></i> Voltar para a loja</button><div class="product-shell"><section class="gallery"><div id="mainMedia" class="main-media"></div><div id="thumbs" class="thumbs"></div></section><section class="info"><span id="category" class="cat-label"></span><h1 id="name"></h1><p id="description" class="desc"></p><div id="price" class="big-price"></div><div id="variationWrap"><div class="section-title">Escolha uma opção</div><div id="options" class="options"></div></div><div class="section-title">Observação</div><textarea id="note" maxlength="240" placeholder="Ex.: sem cebola, embalagem para presente..."></textarea><div class="buybar"><div class="qty"><button id="minus">−</button><strong id="qty">1</strong><button id="plus">+</button></div><button id="add" class="btn btn-primary"><span>Adicionar</span><strong id="addTotal"></strong></button></div></section></div>
<section id="recommend" class="recommend is-hidden"><div class="recommend-head"><div><small>DA MESMA CATEGORIA</small><h2>Veja também</h2></div><small>Até 6 produtos</small></div><div id="recommendGrid" class="recommend-grid"></div></section></main>
<footer class="footer"><div class="footer-inner shell"><strong id="footerName">Loja</strong><small>Detalhes do produto</small></div></footer><script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const $ = (id) => document.getElementById(id);
const $$ = (selector,root=document) => [...root.querySelectorAll(selector)];
const money = value => Number(value||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = value => String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const digits = value => String(value||'').replace(/\D/g,'');
const qs = new URLSearchParams(location.search);

function slug(){
  const q = qs.get('slug');
  if(q) return q;
  const parts=location.pathname.split('/').filter(Boolean);
  const last=(parts.at(-1)||'').replace(/\.html$/i,'');
  return ['index','loja','carrinho','pop_produto'].includes(last)?'':last;
}
async function getDb(){
  const r=await fetch('/api/public-config',{headers:{Accept:'application/json'},cache:'no-store'});
  if(!r.ok) throw new Error('Configuração pública indisponível.');
  const c=await r.json();
  if(!c.supabaseUrl||!c.supabaseAnonKey) throw new Error('Supabase não configurado.');
  return createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
}
function cartKey(storeId){return `clena_cart_${storeId}`}
function readCart(storeId){try{return JSON.parse(localStorage.getItem(cartKey(storeId))||'[]')}catch{return []}}
function writeCart(storeId,items){localStorage.setItem(cartKey(storeId),JSON.stringify(items)); window.dispatchEvent(new CustomEvent('clena-cart-updated'))}
function cartCount(items){return items.reduce((n,i)=>n+Number(i.quantity||0),0)}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2500)}
function productPrice(p){const sale=Number(p.sale_price||0);return sale>0&&sale<Number(p.price||0)?sale:Number(p.price||0)}
function hasSale(p){return Number(p.sale_price||0)>0&&Number(p.sale_price)<Number(p.price||0)}
async function loadStore(db,s){
  if(!s) throw new Error('Informe o slug da loja.');
  const {data,error}=await db.from('stores').select('*').eq('slug',s).eq('is_published',true).maybeSingle();
  if(error) throw error;if(!data) throw new Error('Loja não encontrada.');
  return data;
}
function applyStoreTheme(store){
  document.documentElement.style.setProperty('--primary',store.primary_color||'#2563eb');
  document.documentElement.style.setProperty('--accent',store.accent_color||'#0f172a');
  const a=store.appearance_settings||{};
  document.documentElement.style.setProperty('--bg',a.background_color||'#f6f8fc');
  document.documentElement.style.setProperty('--card',a.card_color||'#fff');
  document.documentElement.style.setProperty('--text',a.text_color||'#0f172a');
  document.documentElement.style.setProperty('--muted',a.muted_color||'#64748b');
}
function setHeader(store){
  document.title=store.name;
  $('storeName').textContent=store.name;
  $('storeStatus').textContent=store.is_published?'Loja online':'Catálogo';
  $('brandLogo').innerHTML=store.logo_url?`<img src="${esc(store.logo_url)}" alt="">`:'<i class="ri-store-2-line"></i>';
  $('footerName').textContent=store.name;
}
function setCartBadge(store){
  const badge=$('cartCount');
  if(badge) badge.textContent=cartCount(readCart(store.id));
}

let db,store,product,categories=[],variations=[],media=[],index=0,qty=1,selectedVariation=null;

function indexUrl(){return `/loja/${encodeURIComponent(store.slug)}`}
function cartUrl(){return `/carrinho/${encodeURIComponent(store.slug)}`}

function prefetchUrl(url){
  if(!url || document.head.querySelector(`link[data-prefetch="${CSS.escape(url)}"]`)) return;
  const link=document.createElement('link');
  link.rel='prefetch';
  link.href=url;
  link.as='document';
  link.dataset.prefetch=url;
  document.head.appendChild(link);
}

function navigateSoft(url){
  document.body.classList.add('page-leaving');
  setTimeout(()=>location.assign(url),70);
}

function navigateRelatedProduct(url){
  document.body.classList.add('page-leaving');

  // Produto relacionado substitui o produto atual no histórico.
  // Assim "Voltar" nunca percorre Produto C > Produto B > Produto A.
  setTimeout(()=>location.replace(url),70);
}

function goBackToStore(){
  document.body.classList.add('page-leaving');

  // Regra da loja:
  // voltar do produto SEMPRE retorna ao catálogo, nunca a outro produto.
  setTimeout(()=>{
    location.assign(indexUrl());
  },60);
}

function showMedia(){
  const m=media[index]; if(!m)return;
  $('mainMedia').innerHTML=m.type==='video'?`<video src="${esc(m.url)}" controls playsinline></video>`:`<img src="${esc(m.url)}" alt="${esc(product.name)}">`;
  $('thumbs').innerHTML=media.map((x,i)=>`<button class="thumb ${i===index?'active':''}" data-i="${i}">${x.type==='video'?`<video src="${esc(x.url)}" muted playsinline></video>`:`<img src="${esc(x.url)}" alt="">`}</button>`).join('');
  $$('[data-i]').forEach(b=>b.onclick=()=>{index=Number(b.dataset.i);showMedia()});
}
function updateTotal(){const extra=Number(selectedVariation?.price_adjustment||0);$('qty').textContent=qty;$('addTotal').textContent=money((productPrice(product)+extra)*qty)}
function addToCart(){
  const items=readCart(store.id); const note=$('note').value.trim();
  const key=`${product.id}:${selectedVariation?.id||'base'}:${note}`;
  const found=items.find(i=>i.key===key);
  if(found)found.quantity+=qty;else items.push({key,product:{id:product.id,name:product.name,image_url:product.image_url,price:product.price,sale_price:product.sale_price},variation:selectedVariation?{id:selectedVariation.id,name:selectedVariation.name,price_adjustment:selectedVariation.price_adjustment}:null,note,quantity:qty});
  writeCart(store.id,items);setCartBadge(store);toast('Produto adicionado ao carrinho.');
}
async function init(){
  try{
    db=await getDb();store=await loadStore(db,slug());applyStoreTheme(store);setHeader(store);setCartBadge(store);
    $('backLink').href=indexUrl(); $('backLink').onclick=(event)=>{event.preventDefault();goBackToStore();}; $('backLink2').onclick=goBackToStore; $('cartLink').href=cartUrl(); $('cartLink').onclick=(event)=>{event.preventDefault();navigateSoft(cartUrl());}; prefetchUrl(cartUrl());
    const id=qs.get('id');if(!id)throw new Error('Produto não informado.');
    const [{data:p,error:pe},{data:cats,error:ce},{data:vars,error:ve},{data:gallery,error:ge}]=await Promise.all([
      db.from('store_products').select('*').eq('id',id).eq('store_id',store.id).eq('active',true).maybeSingle(),
      db.from('store_categories').select('*').eq('store_id',store.id).order('position'),
      db.from('store_product_variations').select('*').eq('product_id',id).order('position'),
      db.from('store_gallery_items').select('*').eq('store_id',store.id).eq('active',true).eq('link_type','product').eq('link_value',id).order('position')
    ]);if(pe||ce||ve||ge)throw pe||ce||ve||ge;if(!p)throw new Error('Produto não encontrado.');
    product=p;categories=cats||[];variations=vars||[];
    const cat=categories.find(c=>c.id===product.category_id);$('category').textContent=cat?.name||'Produto';$('name').textContent=product.name;$('description').textContent=product.description||'';$('description').classList.toggle('is-hidden',!product.description);
    $('price').innerHTML=hasSale(product)?`<small>${money(product.price)}</small><strong>${money(productPrice(product))}</strong>`:`<strong>${money(product.price)}</strong>`;
    media=[];if(product.image_url)media.push({type:'image',url:product.image_url});
    (gallery||[]).filter(x=>x.description==='__CLENA_PRODUCT_MEDIA__').forEach(x=>{if(x.media_url&&!media.some(m=>m.url===x.media_url))media.push({type:x.media_type==='video'?'video':'image',url:x.media_url})});
    media=media.slice(0,5);if(!media.length)media=[{type:'image',url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800"><rect width="100%" height="100%" fill="#eef2f7"/><text x="50%" y="50%" text-anchor="middle" fill="#94a3b8" font-size="40">Sem imagem</text></svg>')}];showMedia();
    $('variationWrap').classList.toggle('is-hidden',!variations.length);$('options').innerHTML=variations.map((v,i)=>`<label class="option"><span><input type="radio" name="variation" value="${esc(v.id)}" ${i===0?'checked':''}> ${esc(v.name)}</span><b>${Number(v.price_adjustment||0)?`+ ${money(v.price_adjustment)}`:'Sem acréscimo'}</b></label>`).join('');
    selectedVariation=variations[0]||null;$$('input[name=variation]').forEach(r=>r.onchange=()=>{selectedVariation=variations.find(v=>v.id===r.value);updateTotal()});
    $('minus').onclick=()=>{qty=Math.max(1,qty-1);updateTotal()};$('plus').onclick=()=>{qty++;updateTotal()};$('add').onclick=addToCart;updateTotal();
    const {data:related}=await db.from('store_products').select('*').eq('store_id',store.id).eq('category_id',product.category_id).eq('active',true).neq('id',product.id).order('featured',{ascending:false}).order('position').limit(6);
    $('recommend').classList.toggle('is-hidden',!(related||[]).length);$('recommendGrid').innerHTML=(related||[]).map(p=>`<a class="rec" href="/produto/${encodeURIComponent(store.slug)}/${encodeURIComponent(p.id)}">${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:''}<div><strong>${esc(p.name)}</strong><span>${money(productPrice(p))}</span></div></a>`).join('');
    $$('.rec',$('recommendGrid')).forEach(link=>{
      const url=link.href;
      link.addEventListener('click',(event)=>{event.preventDefault();navigateRelatedProduct(url)});
      link.addEventListener('mouseenter',()=>prefetchUrl(url),{once:true});
      link.addEventListener('focus',()=>prefetchUrl(url),{once:true});
    });
    
  }catch(e){document.body.innerHTML=`<main class="shell" style="padding:80px 0"><h1>Produto indisponível</h1><p>${esc(e.message)}</p></main>`}
}
window.addEventListener('pageshow',()=>{
  document.body.classList.remove('page-leaving');
  if(store) setCartBadge(store);
});
init();
</script></body></html>
