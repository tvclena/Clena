</head><body><main class="shell"><section id="hero" class="hero"></section><div class="toolbar"><input id="search" placeholder="Buscar no cardápio"><span id="openStatus" class="status"></span></div><div id="cats" class="chips"></div><section id="items" class="grid"></section></main><button id="cartBtn" class="btn floating">Pedido <span id="cartCount" class="badge">0</span></button><div id="drawer" class="drawer hidden"><aside class="panel"><div class="row"><h2>Seu pedido</h2><button id="close" class="btn secondary">Fechar</button></div><div id="cart"></div><label class="field">Entrega<select id="fulfillment"><option value="delivery">Entrega</option><option value="pickup">Retirada</option></select></label><label id="zoneWrap" class="field">Região<select id="zone"></select></label><label class="field">Nome<input id="name"></label><label class="field">WhatsApp<input id="phone"></label><label id="addressWrap" class="field">Endereço<textarea id="address"></textarea></label><label class="field">Pagamento<select id="payment"></select></label><label class="field">Observações<textarea id="notes"></textarea></label><div id="total" class="summary"></div><button id="checkout" class="btn" style="width:100%;margin-top:12px">Enviar pedido</button></aside></div><script type="module">
const __clenaSources = {"assets/js/public-delivery.js": "import{db,$,money,esc,slugFromUrl,theme,toast,wa}from'./public-common.js';let D,C=[],I=[],G=[],O=[],L=[],Z=[],H=[],cart=[];const {data:d}=await db.from('delivery_profiles').select('*').eq('slug',slugFromUrl()).eq('is_published',true).maybeSingle();if(!d){$('items').innerHTML='<div class=\"empty\">Delivery não encontrado ou não publicado.</div>';throw 0}D=d;theme(D.primary_color,D.accent_color);document.title=D.name;const res=await Promise.all([db.from('delivery_categories').select('*').eq('delivery_id',D.id).eq('active',true).order('position'),db.from('delivery_items').select('*').eq('delivery_id',D.id).eq('active',true).order('position'),db.from('delivery_addon_groups').select('*').eq('delivery_id',D.id).eq('active',true).order('position'),db.from('delivery_zones').select('*').eq('delivery_id',D.id).eq('active',true).order('position'),db.from('delivery_hours').select('*').eq('delivery_id',D.id)]);C=res[0].data||[];I=res[1].data||[];G=res[2].data||[];Z=res[3].data||[];H=res[4].data||[];const{data:effectiveRows,error:effectiveError}=await db.rpc('get_public_delivery_effective_prices',{p_delivery_id:D.id});if(effectiveError)console.warn('[CLENA] preços efetivos indisponíveis',effectiveError);const effectiveMap=new Map((effectiveRows||[]).map(row=>[row.item_id,row]));I=I.map(item=>{const row=effectiveMap.get(item.id);return{...item,effective_price:Number(row?.effective_price??item.sale_price??item.price??0),price_source:row?.price_source||(item.sale_price?'menu_sale':'menu')}});if(G.length){O=(await db.from('delivery_addon_options').select('*').in('group_id',G.map(x=>x.id)).eq('active',true).order('position')).data||[];L=(await db.from('delivery_item_addons').select('*').in('item_id',I.map(x=>x.id))).data||[]}function itemPrice(item){return Number(item?.effective_price??item?.sale_price??item?.price??0)}function isOpen(){if(D.force_closed)return false;if(D.force_open)return true;const n=new Date(),h=H.find(x=>x.day_of_week===n.getDay());if(!h?.is_open)return false;const t=n.toTimeString().slice(0,5);return t>=h.open_time.slice(0,5)&&t<=h.close_time.slice(0,5)}const open=isOpen();$('openStatus').textContent=open?'Aberto agora':'Fechado';$('openStatus').classList.toggle('closed',!open);$('hero').innerHTML=`${D.show_cover&&D.cover_url?`<img class=\"hero-cover\" src=\"${esc(D.cover_url)}\">`:''}<div class=\"hero-body\">${D.logo_url?`<img class=\"logo\" src=\"${esc(D.logo_url)}\">`:''}<div><h1>${esc(D.name)}</h1><p>${esc(D.description||'')}</p><p>${esc(D.estimated_time||'')}</p></div></div>`;let cat='all';$('cats').innerHTML=`<button class=\"chip active\" data-id=\"all\">Todos</button>`+C.map(x=>`<button class=\"chip\" data-id=\"${x.id}\">${esc(x.name)}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.id;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});function render(){const q=$('search').value.toLowerCase(),a=I.filter(x=>(cat==='all'||x.category_id===cat)&&(`${x.name} ${x.description||''}`.toLowerCase().includes(q)));$('items').innerHTML=a.map(x=>`<article class=\"card\">${x.image_url?`<img src=\"${esc(x.image_url)}\">`:''}<div class=\"card-body\"><h3>${esc(x.name)}</h3><p class=\"muted\">${esc(x.description||'')}</p>${x.price_source==='technical_sheet'?`<small style=\"display:block;color:#059669;font-weight:800;margin-bottom:3px\">Preço da ficha técnica</small>`:(x.sale_price?`<span class=\"old\">${money(x.price)}</span> `:'')}<span class=\"price\">${money(itemPrice(x))}</span><p><button class=\"btn add\" data-id=\"${x.id}\" ${x.availability==='soldout'?'disabled':''}>${x.availability==='soldout'?'Esgotado':'Escolher'}</button></p></div></article>`).join('')||'<div class=\"empty\">Nenhum item encontrado.</div>';document.querySelectorAll('.add').forEach(b=>b.onclick=()=>add(b.dataset.id))}async function add(id){const item=I.find(x=>x.id===id),groups=G.filter(g=>L.some(l=>l.item_id===id&&l.group_id===g.id)),addons=[];for(const g of groups){const opts=O.filter(o=>o.group_id===g.id);const txt=opts.map((o,i)=>`${i+1}. ${o.name} ${o.price?money(o.price):''}`).join('\\n');const ans=prompt(`${g.name}${g.required?' (obrigatório)':''}\\n${txt}\\nDigite números separados por vírgula:`)||'';const idx=ans.split(',').map(x=>+x.trim()-1).filter(x=>x>=0);if(g.required&&idx.length<Math.max(1,g.min_selection))return toast('Seleção obrigatória');idx.slice(0,g.max_selection).forEach(i=>opts[i]&&addons.push(opts[i]))}cart.push({item,addons,qty:1});draw()}function fee(){if($('fulfillment').value==='pickup')return 0;return +(Z.find(x=>x.id===$('zone').value)?.fee??D.default_delivery_fee)}function draw(){$('cartCount').textContent=cart.reduce((a,x)=>a+x.qty,0);$('cart').innerHTML=cart.map((x,i)=>`<div class=\"summary\" style=\"margin:8px 0\"><b>${x.qty}x ${esc(x.item.name)}</b><small>${x.addons.map(a=>a.name).join(', ')}</small><div class=\"row\"><span>${money((itemPrice(x.item)+x.addons.reduce((a,o)=>a+Number(o.price),0))*x.qty)}</span><button class=\"btn secondary rm\" data-i=\"${i}\">Remover</button></div></div>`).join('')||'<p class=\"empty\">Pedido vazio.</p>';document.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.i,1);draw()});const sub=cart.reduce((a,x)=>a+(itemPrice(x.item)+x.addons.reduce((s,o)=>s+Number(o.price),0))*x.qty,0),f=fee();$('total').innerHTML=`Subtotal: ${money(sub)}<br>Taxa: ${money(f)}<br><b>Total: ${money(sub+f)}</b>`}$('zone').innerHTML=Z.map(z=>`<option value=\"${z.id}\">${esc(z.name)} — ${money(z.fee)}</option>`).join('');$('payment').innerHTML=[D.accepts_pix&&'PIX',D.accepts_card&&'Cartão',D.accepts_cash&&'Dinheiro',D.accepts_online&&'Online'].filter(Boolean).map(x=>`<option>${x}</option>`).join('');$('fulfillment').onchange=()=>{$('zoneWrap').classList.toggle('hidden',$('fulfillment').value==='pickup');$('addressWrap').classList.toggle('hidden',$('fulfillment').value==='pickup');draw()};$('zone').onchange=draw;$('search').oninput=render;$('cartBtn').onclick=()=>$('drawer').classList.remove('hidden');$('close').onclick=()=>$('drawer').classList.add('hidden');$('checkout').onclick=async()=>{if(!open&&!D.allow_scheduling)return toast(D.closed_message||'Delivery fechado');if(!cart.length||!$('name').value||!$('phone').value)return toast('Preencha os dados');const sub=cart.reduce((a,x)=>a+(itemPrice(x.item)+x.addons.reduce((s,o)=>s+Number(o.price),0))*x.qty,0),f=fee(),total=sub+f;if(sub<D.minimum_order)return toast(`Pedido mínimo ${money(D.minimum_order)}`);const lines=cart.map(x=>`${x.qty}x ${x.item.name}${x.addons.length?' + '+x.addons.map(a=>a.name).join(', '):''}`);if(D.checkout_mode==='internal'){const {data:o,error}=await db.from('delivery_orders').insert({delivery_id:D.id,owner_id:D.owner_id,customer_name:$('name').value,customer_phone:$('phone').value,fulfillment_type:$('fulfillment').value,address:{text:$('address').value},zone_id:$('fulfillment').value==='delivery'?$('zone').value:null,payment_method:$('payment').value,subtotal:sub,delivery_fee:f,total,notes:$('notes').value}).select().single();if(error)return toast(error.message);await db.from('delivery_order_items').insert(cart.map(x=>({order_id:o.id,item_id:x.item.id,item_name:x.item.name,quantity:x.qty,unit_price:itemPrice(x.item),addons:x.addons,total:(itemPrice(x.item)+x.addons.reduce((s,a)=>s+Number(a.price),0))*x.qty})));toast(D.order_success_message||'Pedido recebido');cart=[];draw();return}location.href=wa(D.order_whatsapp,`Olá! Pedido para ${D.name}:\\n${lines.join('\\n')}\\nTipo: ${$('fulfillment').value}\\nEndereço: ${$('address').value}\\nPagamento: ${$('payment').value}\\nTotal: ${money(total)}\\nObs.: ${$('notes').value}`)};render();draw();\n"};
const __clenaUrls = new Map();
const __clenaCreating = new Set();

function __clenaResolve(fromPath, specifier) {
  if (specifier.startsWith('/')) return specifier.slice(1);
  const base = fromPath.split('/').slice(0, -1);
  for (const part of specifier.split('/')) {
    if (!part || part === '.') continue;
    if (part === '..') base.pop();
    else base.push(part);
  }
  return base.join('/');
}

async function __clenaModuleUrl(path) {
  if (__clenaUrls.has(path)) return __clenaUrls.get(path);
  if (__clenaCreating.has(path)) throw new Error('Dependência circular em ' + path);
  __clenaCreating.add(path);

  let source = __clenaSources[path];
  if (typeof source !== 'string') throw new Error('Módulo não incorporado: ' + path);

  const importPattern = /(^\s*import\s+(?:[\s\S]*?\s+from\s+)?["'])([^"']+)(["'];?\s*$)/gm;
  const matches = [...source.matchAll(importPattern)];

  for (const match of matches) {
    const spec = match[2];
    if (spec.startsWith('http://') || spec.startsWith('https://') || spec.startsWith('data:') || spec.startsWith('blob:')) continue;
    const depPath = __clenaResolve(path, spec);
    const depUrl = await __clenaModuleUrl(depPath);
    source = source.replace(match[0], match[1] + depUrl + match[3]);
  }

  const url = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
  __clenaUrls.set(path, url);
  __clenaCreating.delete(path);
  return url;
}

for (const entry of ["assets/js/public-delivery.js"]) {
  const url = await __clenaModuleUrl(entry);
  await import(url);
}
