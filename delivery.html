<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./assets/css/public-base.css"></head><body><main class="shell"><section id="hero" class="hero"></section><div class="toolbar"><input id="search" placeholder="Buscar no cardápio"><span id="openStatus" class="status"></span></div><div id="cats" class="chips"></div><section id="items" class="grid"></section></main><button id="cartBtn" class="btn floating">Pedido <span id="cartCount" class="badge">0</span></button><div id="drawer" class="drawer hidden"><aside class="panel"><div class="row"><h2>Seu pedido</h2><button id="close" class="btn secondary">Fechar</button></div><div id="cart"></div><label class="field">Entrega<select id="fulfillment"><option value="delivery">Entrega</option><option value="pickup">Retirada</option></select></label><label id="zoneWrap" class="field">Região<select id="zone"></select></label><label class="field">Nome<input id="name"></label><label class="field">WhatsApp<input id="phone"></label><label id="addressWrap" class="field">Endereço<textarea id="address"></textarea></label><label class="field">Pagamento<select id="payment"></select></label><label class="field">Observações<textarea id="notes"></textarea></label><div id="total" class="summary"></div><button id="checkout" class="btn" style="width:100%;margin-top:12px">Enviar pedido</button></aside></div><script type="module" src="./assets/js/public-delivery.js"></script></body></html>
