
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root{
  --primary:#2563eb;--accent:#0f172a;--bg:#f6f8fc;--card:#fff;--text:#0f172a;--muted:#64748b;
  --line:rgba(15,23,42,.10);--shadow:0 12px 36px rgba(15,23,42,.08);--shell:1240px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Manrope,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}.is-hidden{display:none!important}a{text-decoration:none;color:inherit}.shell{width:min(var(--shell),calc(100% - 32px));margin:auto}
.btn{border:0;min-height:44px;padding:0 15px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff}.btn-soft{background:var(--card);border:1px solid var(--line);color:var(--text)}
.icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:grid;place-items:center;cursor:pointer}
.loader{position:fixed;inset:0;background:var(--bg);z-index:999;display:grid;place-items:center}.loader span{width:48px;height:48px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;right:18px;top:18px;z-index:1000;padding:12px 15px;border-radius:12px;background:#111827;color:white;box-shadow:var(--shadow);font-size:.82rem}
.site-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.header-inner{height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-logo{width:40px;height:40px;border-radius:11px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}.brand-logo img{width:100%;height:100%;object-fit:cover}.brand-copy{display:grid;min-width:0}.brand-copy strong{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-copy small{font-size:.65rem;color:var(--muted)}
.header-actions{display:flex;gap:8px}.cart-link{position:relative}.cart-count{position:absolute;right:-5px;top:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--primary);color:#fff;font-size:.6rem;font-weight:900;display:grid;place-items:center}
.footer{margin-top:64px;padding:34px 0;background:var(--accent);color:#fff}.footer-inner{display:flex;justify-content:space-between;gap:20px;align-items:center}.footer small{opacity:.7}
@media(max-width:640px){.shell{width:min(100% - 20px,var(--shell))}.brand-copy small{display:none}.footer-inner{display:grid}.header-inner{height:60px}}

.hero{position:relative;min-height:320px;background:var(--accent);overflow:hidden;color:#fff}.hero-media{position:absolute;inset:0;background-size:cover;background-position:center}.hero-media:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,.08))}.hero-content{position:relative;z-index:2;padding:80px 0 38px;max-width:700px}.hero-content h1{font-size:clamp(2rem,6vw,4rem);line-height:1;margin:0}.hero-content p{max-width:560px;line-height:1.6;opacity:.88}
.catalog{padding:38px 0 20px}.catalog-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.catalog-head h2{margin:0;font-size:1.8rem}.catalog-head p{margin:0;color:var(--muted);font-size:.85rem}
.tools{display:grid;grid-template-columns:1fr auto;gap:10px}.search,.sort{height:48px;border:1px solid var(--line);border-radius:13px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 14px}.search input,.sort select{border:0;outline:0;background:transparent;color:var(--text);width:100%}
.categories{display:flex;gap:8px;overflow:auto;padding:16px 0 20px;scrollbar-width:none}.cat{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 13px;font-weight:700;font-size:.75rem;cursor:pointer}.cat.active{background:var(--primary);border-color:var(--primary);color:#fff}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.product{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 7px 22px rgba(15,23,42,.045);transition:.2s}.product:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.product-media{position:relative;aspect-ratio:1;background:#eef2f7}.product-media img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;left:8px;top:8px;padding:4px 6px;border-radius:99px;background:#ef4444;color:#fff;font-size:.52rem;font-weight:900}.product-body{padding:10px}.product-cat{font-size:.55rem;color:var(--primary);font-weight:900;text-transform:uppercase}.product h3{font-size:.78rem;line-height:1.25;margin:5px 0 8px;min-height:2.5em}.price{display:flex;align-items:baseline;gap:5px}.price strong{font-size:.82rem}.price small{text-decoration:line-through;color:var(--muted);font-size:.58rem}.product-footer{display:flex;justify-content:space-between;align-items:center;gap:5px}.view-btn{width:32px;height:32px;border:0;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center}
.empty{text-align:center;padding:50px;color:var(--muted)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:680px){.hero{min-height:240px}.hero-content{padding-top:58px}.catalog-head{display:block}.catalog-head p{margin-top:6px}.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr);gap:7px}.product-body{padding:7px}.product h3{font-size:.64rem}.price strong{font-size:.67rem}.view-btn{width:28px;height:28px}}@media(max-width:390px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div id="loader" class="loader"><span></span></div>
<header class="site-header"><div class="header-inner shell"><a class="brand" href="#"><span id="brandLogo" class="brand-logo"></span><span class="brand-copy"><strong id="storeName">Loja</strong><small id="storeStatus"></small></span></a><div class="header-actions"><a id="cartLink" class="icon-btn cart-link" href="/carrinho.html" aria-label="Carrinho"><i class="ri-shopping-bag-3-line"></i><b id="cartCount" class="cart-count">0</b></a></div></div></header>
<section id="hero" class="hero"><div id="heroMedia" class="hero-media"></div><div class="hero-content shell"><h1 id="heroTitle"></h1><p id="heroText"></p><a href="#catalog" class="btn btn-primary">Ver produtos <i class="ri-arrow-down-line"></i></a></div></section>
<main id="catalog" class="catalog shell"><div class="catalog-head"><div><h2>Produtos</h2><p>Escolha um item para abrir todos os detalhes.</p></div></div><div class="tools"><label class="search"><i class="ri-search-line"></i><input id="search" placeholder="Buscar produtos..."></label><label class="sort"><i class="ri-sort-desc"></i><select id="sort"><option value="">Ordenar</option><option value="name">Nome</option><option value="price_asc">Menor preço</option><option value="price_desc">Maior preço</option></select></label></div><div id="categories" class="categories"></div><div id="grid" class="grid"></div><div id="empty" class="empty is-hidden"><i class="ri-search-eye-line"></i><p>Nenhum produto encontrado.</p></div></main>
<footer class="footer"><div class="footer-inner shell"><strong id="footerName">Loja</strong><small>Catálogo online</small></div></footer>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const $ = (id) => document.getElementById(id);
const $$ = (selector,root=document) => [...root.querySelectorAll(selector)];
const money = value => Number(value||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = value => String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const digits = value => String(value||'').replace(/\D/g,'');
const qs = new URLSearchParams(location.search);

function slug(){
  const q = qs.get('slug');
  if(q) return q;
  const parts=location.pathname.split('/').filter(Boolean);
  const last=(parts.at(-1)||'').replace(/\.html$/i,'');
  return ['index','loja','carrinho','pop_produto'].includes(last)?'':last;
}
async function getDb(){
  const r=await fetch('/api/public-config',{headers:{Accept:'application/json'},cache:'no-store'});
  if(!r.ok) throw new Error('Configuração pública indisponível.');
  const c=await r.json();
  if(!c.supabaseUrl||!c.supabaseAnonKey) throw new Error('Supabase não configurado.');
  return createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
}
function cartKey(storeId){return `clena_cart_${storeId}`}
function readCart(storeId){try{return JSON.parse(localStorage.getItem(cartKey(storeId))||'[]')}catch{return []}}
function writeCart(storeId,items){localStorage.setItem(cartKey(storeId),JSON.stringify(items)); window.dispatchEvent(new CustomEvent('clena-cart-updated'))}
function cartCount(items){return items.reduce((n,i)=>n+Number(i.quantity||0),0)}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2500)}
function productPrice(p){const sale=Number(p.sale_price||0);return sale>0&&sale<Number(p.price||0)?sale:Number(p.price||0)}
function hasSale(p){return Number(p.sale_price||0)>0&&Number(p.sale_price)<Number(p.price||0)}
async function loadStore(db,s){
  if(!s) throw new Error('Informe o slug da loja.');
  const {data,error}=await db.from('stores').select('*').eq('slug',s).eq('is_published',true).maybeSingle();
  if(error) throw error;if(!data) throw new Error('Loja não encontrada.');
  return data;
}
function applyStoreTheme(store){
  document.documentElement.style.setProperty('--primary',store.primary_color||'#2563eb');
  document.documentElement.style.setProperty('--accent',store.accent_color||'#0f172a');
  const a=store.appearance_settings||{};
  document.documentElement.style.setProperty('--bg',a.background_color||'#f6f8fc');
  document.documentElement.style.setProperty('--card',a.card_color||'#fff');
  document.documentElement.style.setProperty('--text',a.text_color||'#0f172a');
  document.documentElement.style.setProperty('--muted',a.muted_color||'#64748b');
}
function setHeader(store){
  document.title=store.name;
  $('storeName').textContent=store.name;
  $('storeStatus').textContent=store.is_published?'Loja online':'Catálogo';
  $('brandLogo').innerHTML=store.logo_url?`<img src="${esc(store.logo_url)}" alt="">`:'<i class="ri-store-2-line"></i>';
  $('footerName').textContent=store.name;
}
function setCartBadge(store){
  const badge=$('cartCount');
  if(badge) badge.textContent=cartCount(readCart(store.id));
}

let db,store,categories=[],products=[],current='all';

function productUrl(id){return `/pop_produto.html?slug=${encodeURIComponent(store.slug)}&id=${encodeURIComponent(id)}`}
function cartUrl(){return `/carrinho.html?slug=${encodeURIComponent(store.slug)}`}

function renderCategories(){
  $('categories').innerHTML=[`<button class="cat ${current==='all'?'active':''}" data-cat="all">Todos</button>`,
    ...categories.map(c=>`<button class="cat ${current===c.id?'active':''}" data-cat="${esc(c.id)}">${esc(c.name)}</button>`)].join('');
  $$('[data-cat]').forEach(b=>b.onclick=()=>{current=b.dataset.cat;renderCategories();renderProducts()});
}
function renderProducts(){
  const q=$('search').value.trim().toLowerCase();
  let list=products.filter(p=>(current==='all'||p.category_id===current)&&(!q||`${p.name} ${p.description||''}`.toLowerCase().includes(q)));
  const sort=$('sort').value;
  if(sort==='price_asc') list.sort((a,b)=>productPrice(a)-productPrice(b));
  if(sort==='price_desc') list.sort((a,b)=>productPrice(b)-productPrice(a));
  if(sort==='name') list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'pt-BR'));
  $('grid').innerHTML=list.map(p=>{
    const cat=categories.find(c=>c.id===p.category_id);
    return `<a class="product" data-product-id="${esc(p.id)}" href="${productUrl(p.id)}">
      <div class="product-media">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:'<div class="empty"><i class="ri-image-line"></i></div>'}${hasSale(p)?'<span class="badge">OFERTA</span>':''}</div>
      <div class="product-body"><span class="product-cat">${esc(cat?.name||'Produto')}</span><h3>${esc(p.name)}</h3>
      <div class="product-footer"><div class="price">${hasSale(p)?`<small>${money(p.price)}</small>`:''}<strong>${money(productPrice(p))}</strong></div><span class="view-btn"><i class="ri-arrow-right-line"></i></span></div></div>
    </a>`;
  }).join('');
  $('empty').classList.toggle('is-hidden',list.length>0);

  $$('[data-product-id]').forEach(link=>{
    link.addEventListener('click',(event)=>{
      event.preventDefault();
      const id=link.dataset.productId;
      location.assign(productUrl(id));
    });
  });
}
async function init(){
  try{
    db=await getDb(); store=await loadStore(db,slug()); applyStoreTheme(store); setHeader(store); setCartBadge(store);
    $('cartLink').href=cartUrl(); $('cartLink').onclick=(event)=>{event.preventDefault();location.assign(cartUrl());};
    const [{data:cats,error:ce},{data:prods,error:pe}]=await Promise.all([
      db.from('store_categories').select('*').eq('store_id',store.id).order('position'),
      db.from('store_products').select('*').eq('store_id',store.id).eq('active',true).order('position')
    ]);
    if(ce||pe) throw ce||pe; categories=cats||[];products=prods||[];
    const a=store.appearance_settings||{};
    $('hero').style.minHeight={compact:'200px',medium:'300px',large:'420px',fullscreen:'78vh'}[a.cover_height]||'300px';
    $('heroMedia').style.backgroundImage=store.banner_url?`url("${String(store.banner_url).replace(/"/g,'%22')}")`:'linear-gradient(135deg,var(--primary),var(--accent))';
    $('heroTitle').textContent=a.hero_title||store.name;
    $('heroText').textContent=a.hero_subtitle||store.description||store.order_note||'Explore nossos produtos.';
    renderCategories();renderProducts();
    $('search').oninput=renderProducts;$('sort').onchange=renderProducts;
    window.addEventListener('storage',()=>setCartBadge(store));
    $('loader').classList.add('is-hidden');
  }catch(e){document.body.innerHTML=`<main class="shell" style="padding:80px 0"><h1>Não foi possível abrir a loja</h1><p>${esc(e.message)}</p></main>`}
}
init();
</script></body></html>
