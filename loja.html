
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="color-scheme" content="light dark">
  <title>Loja</title>

  <!-- Tema em cache aplicado ANTES do primeiro paint.
       Também oculta apenas o frame de restauração quando o cliente está voltando
       de um produto para uma posição profunda do catálogo. -->
  <script>
  (() => {
    try {
      const parts = location.pathname.split('/').filter(Boolean);
      const p = new URLSearchParams(location.search);
      const slug = p.get('slug') || (parts.includes('loja') ? parts[parts.indexOf('loja') + 1] : '') || '';
      window.__CLENA_SLUG__ = slug;

      const theme = JSON.parse(localStorage.getItem(`clena:public:theme:v5:${slug}`) || 'null');
      if (theme) {
        const r = document.documentElement.style;
        const a = theme.appearance_settings || {};
        r.setProperty('--primary', theme.primary_color || '#2563eb');
        r.setProperty('--accent', theme.accent_color || '#0f172a');
        r.setProperty('--bg', a.background_color || '#f6f8fc');
        r.setProperty('--card', a.card_color || '#ffffff');
        r.setProperty('--text', a.text_color || '#0f172a');
        r.setProperty('--muted', a.muted_color || '#64748b');
        r.setProperty('--body-font', `"${a.body_font || 'Manrope'}",sans-serif`);
        r.setProperty('--heading-font', `"${a.heading_font || a.body_font || 'Manrope'}",sans-serif`);
        r.setProperty('--heading-weight', a.heading_weight || 800);
        r.setProperty('--theme-color', theme.primary_color || '#2563eb');
        document.documentElement.dataset.themeCached = '1';
      }

      const view = JSON.parse(sessionStorage.getItem(`clena:public:view:v5:${slug}`) || 'null');
      if (view && Number(view.scrollY || 0) > 80 && Array.isArray(view.products) && view.products.length) {
        document.documentElement.dataset.restoring = '1';
      }
    } catch {}
  })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800;900&family=Nunito:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

  <style>
  :root{
    --primary:#2563eb;
    --accent:#0f172a;
    --bg:#f6f8fc;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --line:color-mix(in srgb,var(--text) 10%,transparent);
    --line-strong:color-mix(in srgb,var(--text) 16%,transparent);
    --primary-soft:color-mix(in srgb,var(--primary) 10%,var(--card));
    --body-font:"Manrope",sans-serif;
    --heading-font:"Manrope",sans-serif;
    --heading-weight:800;
    --theme-color:#2563eb;
    --shell:1320px;
    --card-radius:18px;
    --button-radius:12px;
    --product-ratio:1/1;
    --product-columns:4;
    --gallery-columns:3;
    --gallery-gap:12px;
    --gallery-ratio:1/1;
    --motion-fast:150ms;
    --motion-base:220ms;
    --shadow-soft:0 9px 25px rgba(15,23,42,.07);
    --shadow-medium:0 15px 36px rgba(15,23,42,.12);
    --shadow-strong:0 21px 52px rgba(15,23,42,.20);
  }

  *{box-sizing:border-box}
  html{background:var(--bg);scroll-behavior:auto}
  html[data-restoring="1"] body{visibility:hidden}
  body{
    margin:0;
    min-height:100dvh;
    background:var(--bg);
    color:var(--text);
    font-family:var(--body-font);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  body[data-scroll="smooth"]{scroll-behavior:smooth}
  @media(prefers-reduced-motion:reduce){
    html,body{scroll-behavior:auto!important}
    *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;animation-iteration-count:1!important}
  }
  button,input,select,textarea{font:inherit}
  button,a{ -webkit-tap-highlight-color:transparent }
  button{cursor:pointer}
  a{color:inherit;text-decoration:none}
  img,video{max-width:100%}
  .is-hidden{display:none!important}
  .shell{width:min(var(--shell),calc(100% - 36px));margin-inline:auto}
  h1,h2,h3,h4,h5,strong{font-family:var(--heading-font);font-weight:var(--heading-weight)}
  .muted{color:var(--muted)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* ---------- HEADER ---------- */
  .store-header{
    z-index:80;
    width:100%;
    border-bottom:1px solid transparent;
    transition:background var(--motion-base),border-color var(--motion-base),box-shadow var(--motion-base);
  }
  body[data-header-position="sticky"] .store-header{position:sticky;top:0}
  body[data-header-position="static"] .store-header{position:relative}
  body[data-header-style="solid"] .store-header{
    background:color-mix(in srgb,var(--card) 96%,transparent);
    border-bottom-color:var(--line);
  }
  body[data-header-style="transparent"] .store-header{
    background:color-mix(in srgb,var(--card) 78%,transparent);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  body[data-header-style="minimal"] .store-header{background:var(--bg)}
  body[data-header-style="floating"] .store-header{
    position:sticky;
    top:10px;
    width:min(var(--shell),calc(100% - 24px));
    margin:10px auto 0;
    border:1px solid var(--line);
    border-radius:16px;
    background:color-mix(in srgb,var(--card) 91%,transparent);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 10px 34px rgba(15,23,42,.08);
  }
  .header-inner{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  body[data-header-style="floating"] .header-inner{width:100%;padding-inline:15px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand-logo{
    width:42px;height:42px;flex:0 0 42px;
    display:grid;place-items:center;overflow:hidden;
    background:var(--primary);color:#fff;border:1px solid var(--line);
    border-radius:13px;font-size:19px
  }
  .brand-logo img{width:100%;height:100%;object-fit:cover;display:block}
  body[data-logo-shape="circle"] .brand-logo{border-radius:50%}
  body[data-logo-shape="square"] .brand-logo{border-radius:0}
  body[data-logo-shape="free"] .brand-logo{border:0;background:transparent}
  body[data-logo-shape="free"] .brand-logo img{object-fit:contain}
  .brand-copy{min-width:0;display:grid}
  .brand-copy strong{max-width:min(50vw,340px);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-copy small{font-size:.61rem;color:var(--muted);margin-top:2px}
  .header-actions{display:flex;align-items:center;gap:7px}
  .icon-btn{
    position:relative;width:41px;height:41px;border:1px solid var(--line);
    border-radius:11px;background:var(--card);color:var(--text);
    display:grid;place-items:center;font-size:18px
  }
  .cart-badge{
    position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;padding:0 5px;
    border-radius:999px;background:var(--primary);color:#fff;display:grid;place-items:center;
    font-size:.56rem;font-weight:900;border:2px solid var(--bg)
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;isolation:isolate;overflow:hidden;
    min-height:var(--hero-height,320px);background:var(--accent);color:#fff
  }
  body[data-header-style="floating"] .hero{margin-top:-78px;padding-top:78px}
  .hero-media,.hero-overlay{position:absolute;inset:0}
  .hero-media{background:linear-gradient(135deg,var(--primary),var(--accent));background-size:cover;background-repeat:no-repeat}
  .hero-media img,.hero-media video{width:100%;height:100%;display:block;object-fit:var(--cover-fit,cover);object-position:var(--cover-position,center)}
  .hero-overlay{background:#000;opacity:var(--cover-overlay,.35);pointer-events:none}
  .hero-inner{position:relative;z-index:2;min-height:inherit;display:flex;align-items:flex-end;padding-block:50px 34px}
  .hero-copy{max-width:720px}
  body[data-hero-align="center"] .hero-inner{justify-content:center;text-align:center}
  body[data-hero-align="center"] .hero-copy{display:grid;justify-items:center}
  body[data-hero-align="right"] .hero-inner{justify-content:flex-end;text-align:right}
  body[data-hero-align="right"] .hero-copy{display:grid;justify-items:end}
  .hero-kicker{display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;font-size:.61rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
  .hero-title{margin:0;font-size:clamp(2.15rem,6vw,5rem);line-height:.96;letter-spacing:-.05em;text-wrap:balance}
  .hero-subtitle{max-width:620px;margin:12px 0 0;line-height:1.62;font-size:clamp(.78rem,1.6vw,.98rem);opacity:.88;white-space:pre-line}
  .hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
  .primary-action,.secondary-action{
    min-height:43px;padding:0 15px;border-radius:var(--button-radius);border:1px solid transparent;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:.75rem;font-weight:900;
    transition:transform var(--motion-fast),box-shadow var(--motion-fast),filter var(--motion-fast)
  }
  .primary-action{background:var(--primary);color:#fff}
  .secondary-action{background:color-mix(in srgb,#fff 13%,transparent);border-color:rgba(255,255,255,.28);color:#fff;backdrop-filter:blur(8px)}
  body[data-button-style="pill"]{--button-radius:999px}
  body[data-button-style="square"]{--button-radius:0}
  body[data-button-style="rounded"]{--button-radius:12px}
  body[data-button-style="outline"] .primary-action{background:transparent;border-color:currentColor;color:inherit}
  body[data-button-hover="lift"] .primary-action:hover,
  body[data-button-hover="lift"] .product-open:hover{transform:translateY(-2px)}
  body[data-button-hover="scale"] .primary-action:hover,
  body[data-button-hover="scale"] .product-open:hover{transform:scale(1.035)}
  body[data-button-hover="glow"] .primary-action:hover,
  body[data-button-hover="glow"] .product-open:hover{box-shadow:0 0 0 5px color-mix(in srgb,var(--primary) 22%,transparent)}
  body[data-button-hover="slide"] .primary-action:hover i,
  body[data-button-hover="slide"] .product-open:hover i{transform:translateX(2px)}

  /* ---------- CONTENT SLOTS ---------- */
  .slot{display:none}
  .slot.has-content{display:block}
  .slot-inner{padding-top:18px}
  .slot[data-slot="before_footer"] .slot-inner{padding-bottom:16px}

  /* ---------- BANNERS ---------- */
  .banner-stage{position:relative}
  .banner-stage.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .banner-stage.mode-single .banner-item:not(:first-child){display:none}
  .banner-stage.mode-carousel{overflow:hidden;border-radius:calc(var(--card-radius) + 2px)}
  .banner-track{display:flex;transition:transform var(--banner-transition,450ms) ease;will-change:transform}
  .banner-stage.mode-carousel .banner-item{flex:0 0 100%}
  .banner-item{
    position:relative;overflow:hidden;min-height:250px;
    border:1px solid var(--line);border-radius:var(--card-radius);background:#111827;color:#fff
  }
  .banner-item[data-height="compact"]{min-height:180px}
  .banner-item[data-height="medium"]{min-height:250px}
  .banner-item[data-height="large"]{min-height:360px}
  .banner-item>img,.banner-item>video{position:absolute;inset:0;width:100%;height:100%;object-fit:var(--banner-fit,cover);object-position:var(--banner-position,center)}
  .banner-item-shade{position:absolute;inset:0;background:#000;opacity:var(--banner-overlay,.25)}
  .banner-copy{position:relative;z-index:2;min-height:inherit;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
  .banner-copy[data-align="center"]{align-items:center;text-align:center}
  .banner-copy[data-align="right"]{align-items:flex-end;text-align:right}
  .banner-copy h2{max-width:760px;margin:0;font-size:clamp(1.35rem,3vw,2.4rem);line-height:1.05}
  .banner-copy p{max-width:620px;margin:8px 0 0;line-height:1.5;font-size:.78rem;opacity:.88}
  .banner-copy .primary-action{margin-top:14px}
  .banner-controls{position:absolute;z-index:5;inset:50% 10px auto;transform:translateY(-50%);display:flex;justify-content:space-between;pointer-events:none}
  .banner-controls button{pointer-events:auto;width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.36);color:#fff;display:grid;place-items:center;backdrop-filter:blur(8px)}
  .banner-dots{position:absolute;z-index:5;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px}
  .banner-dots button{width:7px;height:7px;padding:0;border:0;border-radius:999px;background:rgba(255,255,255,.45)}
  .banner-dots button.active{width:20px;background:#fff}
  @media(max-width:700px){.banner-stage.mode-grid{grid-template-columns:1fr}.banner-item{min-height:210px}.banner-copy{padding:20px}}

  /* ---------- CATALOG ---------- */
  .catalog{padding:34px 0 22px}
  .catalog-heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:14px}
  .catalog-heading h2{margin:0;font-size:clamp(1.4rem,2.4vw,2rem);letter-spacing:-.035em}
  .catalog-heading p{margin:5px 0 0;color:var(--muted);font-size:.75rem}
  .catalog-status{font-size:.65rem;color:var(--muted);white-space:nowrap}
  .catalog-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px}
  .search-control,.sort-control{
    height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);
    display:flex;align-items:center;gap:9px;padding:0 12px
  }
  .search-control input,.sort-control select{width:100%;border:0;outline:0;background:transparent;color:var(--text)}
  .search-control input::placeholder{color:color-mix(in srgb,var(--muted) 72%,transparent)}
  .search-clear{display:none;width:28px;height:28px;border:0;background:transparent;color:var(--muted);border-radius:8px}
  .search-control.has-value .search-clear{display:grid;place-items:center}
  body[data-show-search="0"] .search-control{display:none}
  body[data-show-search="0"] .catalog-tools{grid-template-columns:auto;justify-content:end}
  .categories-wrap{padding-top:13px}
  body[data-sticky-categories="1"] .categories-wrap{position:sticky;top:var(--sticky-offset,68px);z-index:48;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent}
  .categories{display:flex;gap:7px;overflow:auto;padding:3px 1px 13px;scrollbar-width:none}
  .categories::-webkit-scrollbar{display:none}
  .category-btn{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);min-height:34px;padding:0 11px;border-radius:999px;font-size:.66rem;font-weight:850;white-space:nowrap}
  .category-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
  body[data-category-style="underline"] .category-btn{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding-inline:5px}
  body[data-category-style="underline"] .category-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
  body[data-category-style="minimal"] .category-btn{border:0;background:transparent;padding-inline:4px}
  body[data-category-style="minimal"] .category-btn.active{color:var(--primary)}
  body[data-category-style="cards"] .category-btn{border-radius:10px;box-shadow:0 4px 13px rgba(15,23,42,.05)}

  .products{
    display:grid;
    grid-template-columns:repeat(var(--product-columns),minmax(0,1fr));
    gap:12px
  }
  body[data-product-layout="list"] .products{grid-template-columns:1fr}
  .product-card{
    min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--card-radius);
    overflow:hidden;position:relative;transition:transform var(--motion-base),box-shadow var(--motion-base),border-color var(--motion-base)
  }
  body[data-card-shadow="none"] .product-card{box-shadow:none}
  body[data-card-shadow="soft"] .product-card{box-shadow:var(--shadow-soft)}
  body[data-card-shadow="medium"] .product-card{box-shadow:var(--shadow-medium)}
  body[data-card-shadow="strong"] .product-card{box-shadow:var(--shadow-strong)}
  body[data-card-animation="lift"] .product-card:hover{transform:translateY(-4px)}
  body[data-card-animation="zoom"] .product-card:hover .product-image img{transform:scale(1.035)}
  body[data-card-animation="border"] .product-card:hover{border-color:var(--primary)}
  .product-image{position:relative;aspect-ratio:var(--product-ratio);background:color-mix(in srgb,var(--text) 4%,var(--card));overflow:hidden}
  .product-image img{width:100%;height:100%;display:block;object-fit:cover;transition:transform var(--motion-base)}
  .product-placeholder{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font-size:22px}
  .sale-badge,.featured-badge{
    position:absolute;top:8px;z-index:2;display:inline-flex;align-items:center;justify-content:center;
    height:23px;border-radius:999px;font-size:.49rem;font-weight:950;letter-spacing:.04em
  }
  .sale-badge{left:8px;padding:0 7px;background:#ef4444;color:#fff}
  .featured-badge{right:8px;width:23px;background:#fbbf24;color:#713f12}
  .product-copy{padding:10px}
  .product-category{display:block;color:var(--primary);font-size:.51rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .product-card h3{margin:5px 0 6px;font-size:.76rem;line-height:1.28;min-height:2.55em}
  .product-desc{margin:0 0 8px;color:var(--muted);font-size:.61rem;line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .product-bottom{display:flex;align-items:end;justify-content:space-between;gap:7px}
  .product-price{display:grid;min-width:0}
  .product-price small{font-size:.51rem;color:var(--muted);text-decoration:line-through}
  .product-price strong{font-size:.78rem;white-space:nowrap}
  .product-open{width:30px;height:30px;flex:0 0 30px;border:0;border-radius:var(--button-radius);display:grid;place-items:center;background:var(--primary);color:#fff}
  body[data-product-align="center"] .product-copy{text-align:center}
  body[data-product-align="center"] .product-bottom{align-items:center;flex-direction:column}
  body[data-product-align="center"] .product-open{width:100%}
  body[data-product-layout="list"] .product-card{display:grid;grid-template-columns:160px minmax(0,1fr)}
  body[data-product-layout="list"] .product-image{aspect-ratio:1;height:100%}
  body[data-product-layout="list"] .product-card h3{min-height:0;font-size:.88rem}
  body[data-product-layout="list"] .product-desc{-webkit-line-clamp:3}
  .skeleton-card{pointer-events:none}
  .skeleton-card .product-image,.skeleton-line{background:linear-gradient(90deg,color-mix(in srgb,var(--text) 4%,var(--card)),color-mix(in srgb,var(--text) 8%,var(--card)),color-mix(in srgb,var(--text) 4%,var(--card)));background-size:220% 100%;animation:skeleton 1.1s linear infinite}
  .skeleton-card .product-copy{display:grid;gap:7px}.skeleton-line{height:10px;border-radius:999px}.skeleton-line.short{width:55%}
  @keyframes skeleton{to{background-position:-220% 0}}
  .catalog-empty{padding:58px 20px;text-align:center;color:var(--muted)}
  .catalog-empty i{display:block;font-size:34px;color:var(--primary);margin-bottom:8px}
  .catalog-empty h3{margin:0;color:var(--text)}
  .catalog-empty p{margin:5px 0 0;font-size:.74rem}
  .load-sentinel{height:80px;display:grid;place-items:center;color:var(--muted);font-size:.67rem}
  .load-more{
    min-height:38px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:.66rem;font-weight:800
  }
  .mini-spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- GALLERY ---------- */
  .gallery-section{padding:24px 0}
  .gallery-head{text-align:center;margin-bottom:14px}
  .gallery-head h2{margin:0;font-size:clamp(1.3rem,2.5vw,1.9rem)}
  .gallery-head p{margin:5px 0 0;color:var(--muted);font-size:.73rem}
  .gallery{
    display:grid;grid-template-columns:repeat(var(--gallery-columns),minmax(0,1fr));gap:var(--gallery-gap)
  }
  .gallery[data-layout="masonry"]{display:block;columns:var(--gallery-columns);column-gap:var(--gallery-gap)}
  .gallery[data-layout="masonry"] .gallery-item{break-inside:avoid;margin-bottom:var(--gallery-gap)}
  .gallery[data-layout="carousel"],.gallery[data-layout="horizontal"],.gallery[data-layout="stories"]{
    display:flex;overflow:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px
  }
  .gallery[data-layout="carousel"] .gallery-item,.gallery[data-layout="horizontal"] .gallery-item{flex:0 0 min(76vw,360px);scroll-snap-align:start}
  .gallery[data-layout="stories"] .gallery-item{flex:0 0 118px;border-radius:18px;scroll-snap-align:start}
  .gallery[data-layout="featured"]{grid-template-columns:2fr repeat(2,1fr)}
  .gallery[data-layout="featured"] .gallery-item:first-child{grid-row:span 2}
  .gallery-item{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden}
  .gallery-media{position:relative;aspect-ratio:var(--gallery-ratio);background:color-mix(in srgb,var(--text) 4%,var(--card));overflow:hidden}
  .gallery-media img,.gallery-media video{width:100%;height:100%;display:block;object-fit:var(--gallery-fit,cover);object-position:var(--gallery-position,center)}
  .gallery-copy{padding:9px}.gallery-copy strong{font-size:.7rem}.gallery-copy p{margin:3px 0 0;color:var(--muted);font-size:.6rem;line-height:1.4}
  .gallery-open{border:0;padding:0;width:100%;background:transparent;text-align:inherit;color:inherit}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:18px;background:rgba(2,6,23,.88);backdrop-filter:blur(14px)}
  .lightbox-card{position:relative;width:min(1060px,100%);height:min(86dvh,760px);display:grid;place-items:center}
  .lightbox-card img,.lightbox-card video{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
  .lightbox-close{position:absolute;right:0;top:0;width:40px;height:40px;border:0;border-radius:11px;background:rgba(255,255,255,.13);color:#fff;font-size:20px}

  /* ---------- FOOTER ---------- */
  .store-footer{margin-top:48px;background:var(--accent);color:#fff}
  body[data-footer-background="primary"] .store-footer{background:var(--primary)}
  body[data-footer-background="light"] .store-footer{background:var(--card);color:var(--text);border-top:1px solid var(--line)}
  body[data-footer-background="dark"] .store-footer{background:#080d18;color:#fff}
  .footer-inner{min-height:120px;padding-block:28px;display:flex;align-items:center;justify-content:space-between;gap:24px}
  body[data-footer-style="centered"] .footer-inner{flex-direction:column;text-align:center;justify-content:center}
  body[data-footer-style="columns"] .footer-inner{align-items:flex-start}
  .footer-brand strong{font-size:.95rem}.footer-brand p{max-width:520px;margin:6px 0 0;opacity:.72;font-size:.7rem;line-height:1.5}
  .socials{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .socials a{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:16px}
  body[data-footer-background="light"] .socials a{background:var(--primary-soft);color:var(--primary)}

  /* ---------- FLOATING ---------- */
  .floating-stack{position:fixed;right:15px;bottom:max(15px,env(safe-area-inset-bottom));z-index:110;display:grid;gap:8px}
  .floating-action{
    position:relative;width:45px;height:45px;border:0;border-radius:50%;display:grid;place-items:center;
    color:#fff;box-shadow:0 12px 30px rgba(15,23,42,.22);font-size:19px
  }
  .floating-whatsapp{background:#22c55e}
  .floating-cart{background:var(--primary)}
  .floating-action .cart-badge{border-color:transparent;right:-3px;top:-3px}
  .back-top{background:var(--accent);opacity:0;pointer-events:none;transform:translateY(8px);transition:.18s}
  .back-top.visible{opacity:1;pointer-events:auto;transform:none}

  /* ---------- PAGE ANIMATIONS ---------- */
  body[data-page-animation="fade"].page-ready .hero-copy,
  body[data-page-animation="fade"].page-ready .catalog{animation:pageFade var(--page-speed,.28s) both}
  body[data-page-animation="slide-up"].page-ready .hero-copy,
  body[data-page-animation="slide-up"].page-ready .catalog{animation:pageUp var(--page-speed,.32s) both}
  body[data-page-animation="zoom"].page-ready .hero-copy{animation:pageZoom var(--page-speed,.3s) both}
  @keyframes pageFade{from{opacity:.01}to{opacity:1}}
  @keyframes pageUp{from{opacity:.01;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pageZoom{from{opacity:.01;transform:scale(.985)}to{opacity:1;transform:none}}

  /* ---------- RESPONSIVE ---------- */
  @media(max-width:1120px){.products{grid-template-columns:repeat(min(var(--product-columns),4),minmax(0,1fr))}}
  @media(max-width:900px){
    .products{grid-template-columns:repeat(3,minmax(0,1fr))}
    .gallery{--gallery-columns:3}
  }
  @media(max-width:690px){
    .shell{width:min(var(--shell),calc(100% - 20px))}
    body[data-header-style="floating"] .store-header{width:calc(100% - 14px);top:7px;margin-top:7px}
    .header-inner{height:59px}
    body[data-header-style="floating"] .hero{margin-top:-73px;padding-top:73px}
    .brand-logo{width:37px;height:37px;flex-basis:37px}
    .brand-copy small{display:none}
    .hero-inner{padding-block:34px 23px}
    .hero-title{font-size:clamp(2rem,11vw,3.4rem)}
    .catalog{padding-top:24px}
    .catalog-heading{align-items:flex-start}
    .catalog-status{display:none}
    .catalog-tools{grid-template-columns:1fr}
    body[data-show-search="0"] .catalog-tools{grid-template-columns:1fr}
    .sort-control{height:40px}
    .products{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .product-copy{padding:7px}
    .product-category,.product-desc{display:none}
    .product-card h3{font-size:.61rem;min-height:2.5em;margin:2px 0 5px}
    .product-price strong{font-size:.64rem}
    .product-price small{font-size:.48rem}
    .product-open{width:25px;height:25px;flex-basis:25px;border-radius:7px;font-size:12px}
    body[data-product-layout="list"] .product-card{grid-template-columns:105px minmax(0,1fr)}
    body[data-product-layout="list"] .product-category,body[data-product-layout="list"] .product-desc{display:block}
    body[data-product-layout="list"] .product-card h3{font-size:.72rem}
    .gallery{--gallery-columns:2}
    .footer-inner{display:grid}
  }
  @media(max-width:390px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}}

  /* CSS customizado do editor é colocado aqui via JS, por último. */

      <div id="lightboxContent"></div>
    </div>
  </div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const $ = (id) => document.getElementById(id);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

const PAGE_SIZE = matchMedia('(max-width:690px)').matches ? 18 : 24;
const MAX_VIEW_CACHE_PRODUCTS = 120;
const THEME_CACHE_VERSION = 5;
const VIEW_CACHE_VERSION = 5;
const CONFIG_CACHE_TTL = 12 * 60 * 60 * 1000;

const state = {
  sb: null,
  store: null,
  categories: [],
  products: [],
  category: '',
  query: '',
  sort: 'position',
  page: 0,
  hasMore: true,
  loading: false,
  requestToken: 0,
  bannersLoaded: false,
  galleryLoaded: false,
  restored: false,
  restoringView: null,
  bannerControllers: [],
  observer: null,
  searchTimer: null
};

const APPEARANCE_DEFAULTS = {
  theme:'minimal',cover_type:'image',cover_video_external_url:'',cover_fit:'cover',cover_position:'center',
  cover_height:'medium',cover_overlay:35,logo_shape:'rounded',hero_alignment:'left',hero_title:'',
  hero_subtitle:'',hero_button_text:'Ver produtos',hero_button_target:'products',background_color:'#f6f8fc',
  card_color:'#ffffff',text_color:'#0f172a',muted_color:'#64748b',body_font:'Manrope',heading_font:'Manrope',
  heading_weight:'800',font_scale:'normal',desktop_columns:3,product_image_ratio:'square',card_radius:'large',
  card_shadow:'soft',product_text_alignment:'left',category_style:'pills',show_search:true,sticky_categories:false,
  show_featured:true,show_sale_badge:true,show_product_description:true,button_style:'rounded',button_hover:'lift',
  page_animation:'fade',card_animation:'lift',animation_speed:'normal',scroll_behavior:'smooth',respect_reduced_motion:true,
  show_back_to_top:true,header_style:'transparent',header_position:'static',footer_style:'simple',
  footer_background:'accent',footer_text:'',show_social_links:true,social_instagram:'',social_facebook:'',
  social_tiktok:'',social_youtube:'',social_x:'',social_pinterest:'',floating_whatsapp:true,floating_cart:false,
  custom_css:'',banner_display_mode:'carousel',banner_autoplay:true,banner_autoplay_delay:5000,banner_loop:true,
  banner_arrows:true,banner_dots:true,banner_pause_interaction:true,banner_default_height:'medium',
  banner_transition:'slide',gallery_layout:'grid',gallery_columns:3,gallery_ratio:'square',gallery_gap:'medium',
  gallery_title:'',gallery_subtitle:'',gallery_position:'after_products',gallery_lightbox:true,gallery_autoplay:false,
  gallery_loop:true
};

function esc(value) {
  return String(value ?? '').replace(/[&<>'"]/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
  }[c]));
}
function money(value) {
  return Number(value || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}
function digits(value){ return String(value || '').replace(/\D/g,''); }
function safeUrl(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  try {
    const url = new URL(raw, location.origin);
    if (!['http:','https:'].includes(url.protocol)) return '';
    return url.href;
  } catch { return ''; }
}
function slug() {
  if (window.__CLENA_SLUG__) return window.__CLENA_SLUG__;
  const q = new URLSearchParams(location.search).get('slug');
  if (q) return q;
  const parts = location.pathname.split('/').filter(Boolean);
  const i = parts.indexOf('loja');
  return i >= 0 ? parts[i + 1] || '' : '';
}
function routeStore(){ return `/loja/${encodeURIComponent(state.store?.slug || slug())}`; }
function routeProduct(id){ return `/produto/${encodeURIComponent(state.store.slug)}/${encodeURIComponent(id)}`; }
function routeCart(){ return `/carrinho/${encodeURIComponent(state.store.slug)}`; }
function themeCacheKey(){ return `clena:public:theme:v${THEME_CACHE_VERSION}:${slug()}`; }
function viewCacheKey(){ return `clena:public:view:v${VIEW_CACHE_VERSION}:${slug()}`; }
function cartKey(){ return `clena_public_cart_${state.store?.id || ''}`; }

function readCart(){
  if (!state.store?.id) return [];
  try { return JSON.parse(localStorage.getItem(cartKey()) || '[]'); } catch { return []; }
}
function updateCartBadges(){
  const count = readCart().reduce((sum,item)=>sum + Number(item.quantity || 0),0);
  $('cartCount').textContent = count;
  $('floatingCartCount').textContent = count;
}

async function getPublicConfig() {
  try {
    const cached = JSON.parse(sessionStorage.getItem('clena:public:config:v2') || 'null');
    if (cached && Date.now() - cached.at < CONFIG_CACHE_TTL && cached.supabaseUrl && cached.supabaseAnonKey) return cached;
  } catch {}
  const response = await fetch('/api/public-config', {
    headers:{Accept:'application/json'},
    cache:'force-cache'
  });
  if (!response.ok) throw new Error('Configuração pública indisponível.');
  const cfg = await response.json();
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) throw new Error('Supabase não configurado.');
  try { sessionStorage.setItem('clena:public:config:v2', JSON.stringify({...cfg,at:Date.now()})); } catch {}
  return cfg;
}

async function getDb() {
  const cfg = await getPublicConfig();
  return createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
    auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},
    global:{headers:{'x-clena-public':'store'}}
  });
}

function normalizeAppearance(store) {
  return {...APPEARANCE_DEFAULTS, ...(store?.appearance_settings || {})};
}

function cardRadius(value){
  return ({none:'0px',small:'8px',medium:'13px',large:'20px'})[value] || '18px';
}
function productRatio(value){
  return ({square:'1/1',portrait:'4/5',landscape:'16/10',auto:'1/1'})[value] || '1/1';
}
function galleryRatio(value){
  return ({square:'1/1',portrait:'4/5',landscape:'16/10',auto:'auto'})[value] || '1/1';
}
function galleryGap(value){
  return ({none:'0px',small:'6px',medium:'12px',large:'20px'})[value] || '12px';
}
function heroHeight(value){
  return ({compact:'210px',medium:'320px',large:'450px',fullscreen:'78dvh'})[value] || '320px';
}
function animationSpeed(value){
  return ({slow:'.48s',normal:'.30s',fast:'.18s'})[value] || '.30s';
}

function applyAppearance(store, cache = true) {
  const a = normalizeAppearance(store);
  const root = document.documentElement.style;
  root.setProperty('--primary', store.primary_color || '#2563eb');
  root.setProperty('--accent', store.accent_color || '#0f172a');
  root.setProperty('--bg', a.background_color);
  root.setProperty('--card', a.card_color);
  root.setProperty('--text', a.text_color);
  root.setProperty('--muted', a.muted_color);
  root.setProperty('--body-font', `"${a.body_font}",sans-serif`);
  root.setProperty('--heading-font', `"${a.heading_font}",sans-serif`);
  root.setProperty('--heading-weight', String(a.heading_weight || 800));
  root.setProperty('--card-radius', cardRadius(a.card_radius));
  root.setProperty('--product-ratio', productRatio(a.product_image_ratio));
  root.setProperty('--product-columns', String(Math.max(2, Math.min(7, Number(a.desktop_columns || 3)))));
  root.setProperty('--gallery-columns', String(Math.max(2, Math.min(5, Number(a.gallery_columns || 3)))));
  root.setProperty('--gallery-ratio', galleryRatio(a.gallery_ratio));
  root.setProperty('--gallery-gap', galleryGap(a.gallery_gap));
  root.setProperty('--hero-height', heroHeight(a.cover_height));
  root.setProperty('--cover-overlay', String(Math.max(0,Math.min(100,Number(a.cover_overlay || 0))) / 100));
  root.setProperty('--cover-fit', a.cover_fit || 'cover');
  root.setProperty('--cover-position', a.cover_position || 'center');
  root.setProperty('--page-speed', animationSpeed(a.animation_speed));
  root.setProperty('--sticky-offset', a.header_style === 'floating' ? '86px' : '68px');

  document.body.dataset.headerStyle = a.header_style || 'transparent';
  document.body.dataset.headerPosition = a.header_position || 'static';
  document.body.dataset.logoShape = a.logo_shape || 'rounded';
  document.body.dataset.heroAlign = a.hero_alignment || 'left';
  document.body.dataset.buttonStyle = a.button_style || 'rounded';
  document.body.dataset.buttonHover = a.button_hover || 'lift';
  document.body.dataset.productLayout = store.product_layout || 'grid';
  document.body.dataset.productAlign = a.product_text_alignment || 'left';
  document.body.dataset.cardShadow = a.card_shadow || 'soft';
  document.body.dataset.cardAnimation = a.card_animation || 'lift';
  document.body.dataset.categoryStyle = a.category_style || 'pills';
  document.body.dataset.stickyCategories = a.sticky_categories ? '1' : '0';
  document.body.dataset.showSearch = a.show_search === false ? '0' : '1';
  document.body.dataset.footerStyle = a.footer_style || 'simple';
  document.body.dataset.footerBackground = a.footer_background || 'accent';
  document.body.dataset.pageAnimation = a.page_animation || 'fade';
  document.body.dataset.scroll = a.scroll_behavior || 'smooth';

  $('customStoreCss').textContent = String(a.custom_css || '').slice(0,12000);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', store.primary_color || a.background_color || '#f6f8fc');

  if (cache) {
    try {
      localStorage.setItem(themeCacheKey(), JSON.stringify({
        primary_color:store.primary_color,
        accent_color:store.accent_color,
        appearance_settings:store.appearance_settings || {}
      }));
    } catch {}
  }
}

function normalizeSocialUrl(value, base) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  if (/^https?:\/\//i.test(raw)) return safeUrl(raw);
  const clean = raw.replace(/^@/,'').replace(/^\/+/,'');
  return safeUrl(`${base}${clean}`);
}

function renderStoreChrome() {
  const s = state.store, a = normalizeAppearance(s);
  document.title = s.name || 'Loja';
  $('storeName').textContent = s.name || 'Loja';
  $('storeTagline').textContent = s.estimated_time ? `Prazo: ${s.estimated_time}` : 'Loja online';
  $('footerName').textContent = s.name || 'Loja';
  $('footerText').textContent = a.footer_text || s.description || 'Atendimento direto.';

  $('brandLogo').innerHTML = s.logo_url
    ? `<img src="${esc(s.logo_url)}" alt="${esc(s.name || 'Loja')}" decoding="async">`
    : '<i class="ri-store-2-line"></i>';

  $('heroTitle').textContent = a.hero_title || s.name || 'Loja';
  $('heroSubtitle').textContent = a.hero_subtitle || s.description || '';
  $('heroButton').firstChild.textContent = `${a.hero_button_text || 'Ver produtos'} `;
  $('heroButton').href = heroTarget(a.hero_button_target);

  const hero = $('heroMedia');
  hero.innerHTML = '';
  hero.style.backgroundImage = '';
  if (s.cover_type === 'video' && (s.cover_video_url || a.cover_video_external_url)) {
    const src = safeUrl(s.cover_video_url || a.cover_video_external_url);
    if (src) hero.innerHTML = `<video src="${esc(src)}" autoplay muted loop playsinline preload="metadata"></video>`;
  } else if (s.banner_url) {
    hero.innerHTML = `<img src="${esc(s.banner_url)}" alt="" fetchpriority="high" decoding="async">`;
  }

  $('cartLink').href = routeCart();
  $('floatingCart').href = routeCart();

  const phone = digits(s.whatsapp);
  const wa = phone ? `https://wa.me/${phone}` : '';
  $('headerWhatsapp').hidden = !wa;
  $('headerWhatsapp').href = wa || '#';
  $('floatingWhatsapp').href = wa || '#';
  $('floatingWhatsapp').classList.toggle('is-hidden', !(a.floating_whatsapp && wa));
  $('floatingCart').classList.toggle('is-hidden', !a.floating_cart);
  $('backTop').classList.toggle('is-hidden', !a.show_back_to_top);

  const socialMeta = [
    ['social_instagram','ri-instagram-line','https://instagram.com/'],
    ['social_facebook','ri-facebook-circle-line','https://facebook.com/'],
    ['social_tiktok','ri-tiktok-line','https://tiktok.com/@'],
    ['social_youtube','ri-youtube-line','https://youtube.com/@'],
    ['social_x','ri-twitter-x-line','https://x.com/'],
    ['social_pinterest','ri-pinterest-line','https://pinterest.com/']
  ];
  $('socialLinks').innerHTML = a.show_social_links === false ? '' : socialMeta.map(([key,icon,base]) => {
    const url = normalizeSocialUrl(a[key],base);
    return url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(key.replace('social_',''))}"><i class="${icon}"></i></a>` : '';
  }).join('');

  updateCartBadges();
}

function heroTarget(target) {
  switch (target) {
    case 'categories': return '#categoriesWrap';
    case 'gallery': return '#gallerySection';
    case 'whatsapp': {
      const phone = digits(state.store?.whatsapp);
      return phone ? `https://wa.me/${phone}` : '#productsSection';
    }
    case 'products':
    default: return '#productsSection';
  }
}

async function fetchStore() {
  const {data,error} = await state.sb
    .from('stores')
    .select('*')
    .eq('slug',slug())
    .eq('is_published',true)
    .maybeSingle();
  if (error) throw error;
  if (!data) throw new Error('Loja não encontrada ou não publicada.');
  return data;
}

async function loadCategories() {
  const {data,error} = await state.sb
    .from('store_categories')
    .select('id,name,description,icon,position')
    .eq('store_id',state.store.id)
    .order('position',{ascending:true});
  if (error) throw error;
  state.categories = data || [];
  renderCategories();
}

function renderCategories() {
  const html = [
    `<button class="category-btn ${!state.category ? 'active' : ''}" data-category="" type="button">Todos</button>`,
    ...state.categories.map(c => `<button class="category-btn ${state.category===c.id?'active':''}" data-category="${esc(c.id)}" type="button">${c.icon?`<i class="${esc(c.icon)}"></i> `:''}${esc(c.name)}</button>`)
  ].join('');
  $('categories').innerHTML = html;
  $$('[data-category]',$('categories')).forEach(button => {
    button.onclick = () => {
      if (state.category === button.dataset.category) return;
      state.category = button.dataset.category || '';
      state.products = [];
      state.page = 0;
      state.hasMore = true;
      renderCategories();
      updateUrlState();
      loadProducts({reset:true,reason:'category'});
    };
  });
}

function productPrice(p){
  const sale = Number(p.sale_price || 0), price = Number(p.price || 0);
  return sale > 0 && sale < price ? sale : price;
}
function onSale(p){ return Number(p.sale_price || 0) > 0 && Number(p.sale_price) < Number(p.price || 0); }
function categoryName(id){ return state.categories.find(c=>c.id===id)?.name || ''; }

function productCard(p) {
  const a = normalizeAppearance(state.store);
  const image = p.image_url
    ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" decoding="async">`
    : `<span class="product-placeholder"><i class="ri-image-line"></i></span>`;

  return `<a class="product-card" data-product-id="${esc(p.id)}" href="${routeProduct(p.id)}">
    <div class="product-image">
      ${image}
      ${a.show_sale_badge !== false && onSale(p) ? '<span class="sale-badge">OFERTA</span>' : ''}
      ${a.show_featured !== false && p.featured ? '<span class="featured-badge"><i class="ri-star-fill"></i></span>' : ''}
    </div>
    <div class="product-copy">
      ${categoryName(p.category_id) ? `<span class="product-category">${esc(categoryName(p.category_id))}</span>` : ''}
      <h3>${esc(p.name)}</h3>
      ${a.show_product_description !== false && p.description ? `<p class="product-desc">${esc(p.description)}</p>` : ''}
      <div class="product-bottom">
        <span class="product-price">
          ${onSale(p) ? `<small>${money(p.price)}</small>` : ''}
          <strong>${money(productPrice(p))}</strong>
        </span>
        <span class="product-open" aria-hidden="true"><i class="ri-arrow-right-line"></i></span>
      </div>
    </div>
  </a>`;
}

function skeletonCards(count = 12) {
  return Array.from({length:count},()=>`<article class="product-card skeleton-card">
    <div class="product-image"></div>
    <div class="product-copy"><span class="skeleton-line short"></span><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
  </article>`).join('');
}

function renderProducts({append=false} = {}) {
  const grid = $('productGrid');
  if (!append) grid.innerHTML = state.products.map(productCard).join('');
  else {
    const start = Math.max(0,state.products.length-PAGE_SIZE);
    grid.insertAdjacentHTML('beforeend',state.products.slice(start).map(productCard).join(''));
  }
  bindProductLinks();
  $('catalogEmpty').classList.toggle('is-hidden',state.products.length > 0 || state.loading);
  $('catalogStatus').textContent = state.products.length ? `${state.products.length}${state.hasMore ? '+' : ''} produto(s)` : '';
  updateLoadState();
}

function bindProductLinks() {
  $$('[data-product-id]',$('productGrid')).forEach(link => {
    if (link.dataset.bound) return;
    link.dataset.bound = '1';
    link.addEventListener('click', () => saveViewState());
  });
}

function queryProducts(page) {
  const from = page * PAGE_SIZE, to = from + PAGE_SIZE - 1;
  let q = state.sb
    .from('store_products')
    .select('id,name,description,category_id,sku,price,sale_price,stock,stock_mode,image_url,active,featured,position,created_at')
    .eq('store_id',state.store.id)
    .eq('active',true);

  if (state.category) q = q.eq('category_id',state.category);

  if (state.query) {
    const term = state.query.replace(/[%_,()]/g,' ').replace(/\s+/g,' ').trim().slice(0,80);
    if (term) q = q.or(`name.ilike.%${term}%,description.ilike.%${term}%,sku.ilike.%${term}%`);
  }

  switch (state.sort) {
    case 'recent':
      q = q.order('created_at',{ascending:false});
      break;
    case 'name':
      q = q.order('name',{ascending:true});
      break;
    case 'price_asc':
      q = q.order('price',{ascending:true}).order('position',{ascending:true});
      break;
    case 'price_desc':
      q = q.order('price',{ascending:false}).order('position',{ascending:true});
      break;
    default:
      q = q.order('position',{ascending:true}).order('created_at',{ascending:false});
  }
  return q.range(from,to);
}

async function loadProducts({reset=false,reason='scroll'} = {}) {
  if (state.loading || (!reset && !state.hasMore)) return;
  if (reset) {
    state.requestToken++;
    state.page = 0;
    state.hasMore = true;
    state.products = [];
    $('productGrid').innerHTML = skeletonCards(matchMedia('(max-width:690px)').matches ? 9 : 12);
  }

  const token = state.requestToken;
  state.loading = true;
  updateLoadState();

  try {
    const currentPage = state.page;
    const {data,error} = await queryProducts(currentPage);
    if (error) throw error;
    if (token !== state.requestToken) return;

    const batch = data || [];
    if (reset) state.products = batch;
    else state.products.push(...batch);

    state.hasMore = batch.length === PAGE_SIZE;
    state.page = currentPage + 1;
    renderProducts({append:!reset});
    saveViewState({scroll:false});

    if (reset && reason !== 'restore') requestAnimationFrame(()=>restoreSavedScroll(false));
  } catch (error) {
    console.error('[CLENA] produtos',error);
    if (reset) {
      state.products = [];
      $('productGrid').innerHTML = '';
      $('catalogEmpty').classList.remove('is-hidden');
      $('catalogEmpty').querySelector('h3').textContent = 'Não foi possível carregar os produtos';
      $('catalogEmpty').querySelector('p').textContent = error.message || 'Tente novamente.';
    }
  } finally {
    state.loading = false;
    updateLoadState();
  }
}

function updateLoadState() {
  $('pageSpinner').classList.toggle('is-hidden',!state.loading);
  $('loadMoreButton').classList.toggle('is-hidden',state.loading || !state.hasMore || !state.products.length);
  $('catalogEnd').classList.toggle('is-hidden',state.loading || state.hasMore || !state.products.length);
}

function saveViewState({scroll=true} = {}) {
  if (!state.store) return;
  const payload = {
    at:Date.now(),
    scrollY:scroll ? window.scrollY : Number(state.restoringView?.scrollY || window.scrollY || 0),
    category:state.category,
    query:state.query,
    sort:state.sort,
    page:state.page,
    hasMore:state.hasMore,
    products:state.products.slice(0,MAX_VIEW_CACHE_PRODUCTS),
    categories:state.categories.slice(0,120)
  };
  try { sessionStorage.setItem(viewCacheKey(),JSON.stringify(payload)); } catch {}
}

function loadViewState() {
  try {
    const view = JSON.parse(sessionStorage.getItem(viewCacheKey()) || 'null');
    if (!view || Date.now()-Number(view.at||0) > 45*60*1000 || !Array.isArray(view.products)) return null;
    return view;
  } catch { return null; }
}

function restoreViewSnapshot(view) {
  if (!view) return false;
  state.restoringView = view;
  state.category = view.category || '';
  state.query = view.query || '';
  state.sort = view.sort || 'position';
  state.page = Number(view.page || 0);
  state.hasMore = view.hasMore !== false;
  state.products = view.products || [];
  if (Array.isArray(view.categories) && view.categories.length) state.categories = view.categories;

  $('productSearch').value = state.query;
  $('productSort').value = state.sort;
  $('searchControl').classList.toggle('has-value',!!state.query);
  if (state.categories.length) renderCategories();
  renderProducts();

  return true;
}

function restoreSavedScroll(reveal=true) {
  const view = state.restoringView || loadViewState();
  if (!view || Number(view.scrollY||0) <= 0) {
    if (reveal) revealPage();
    return;
  }
  const target = Number(view.scrollY || 0);
  const doRestore = () => {
    const max = Math.max(0,document.documentElement.scrollHeight - innerHeight);
    window.scrollTo({top:Math.min(target,max),left:0,behavior:'auto'});
    if (reveal) revealPage();
  };
  requestAnimationFrame(()=>requestAnimationFrame(doRestore));
}

function revealPage() {
  delete document.documentElement.dataset.restoring;
  document.body.classList.add('page-ready');
  state.restored = true;
}

function updateUrlState() {
  const url = new URL(location.href);
  if (state.category) url.searchParams.set('cat',state.category); else url.searchParams.delete('cat');
  if (state.query) url.searchParams.set('q',state.query); else url.searchParams.delete('q');
  if (state.sort && state.sort !== 'position') url.searchParams.set('sort',state.sort); else url.searchParams.delete('sort');
  history.replaceState(null,'',url);
}

function applyUrlState() {
  const p = new URLSearchParams(location.search);
  if (p.get('cat')) state.category = p.get('cat');
  if (p.get('q')) state.query = p.get('q').slice(0,80);
  if (p.get('sort')) state.sort = p.get('sort');
}

function bannerVisibleForDevice(item) {
  if (item.device === 'desktop' && matchMedia('(max-width:700px)').matches) return false;
  if (item.device === 'mobile' && !matchMedia('(max-width:700px)').matches) return false;
  return true;
}
function bannerActiveNow(item) {
  if (item.active === false) return false;
  const now = Date.now();
  if (item.starts_at && new Date(item.starts_at).getTime() > now) return false;
  if (item.ends_at && new Date(item.ends_at).getTime() < now) return false;
  return bannerVisibleForDevice(item);
}

function actionUrl(type,value) {
  switch (type) {
    case 'product': return value ? routeProduct(value) : '';
    case 'category': return value ? `${routeStore()}?cat=${encodeURIComponent(value)}#productsSection` : '';
    case 'whatsapp': {
      const phone = digits(value || state.store.whatsapp);
      return phone ? `https://wa.me/${phone}` : '';
    }
    case 'external': return safeUrl(value);
    default: return '';
  }
}

function bannerItem(item) {
  const media = item.media_type === 'video'
    ? `<video src="${esc(item.media_url)}" autoplay muted loop playsinline preload="metadata"></video>`
    : `<img src="${esc(item.media_url)}" alt="${esc(item.title || '')}" loading="lazy" decoding="async">`;
  const url = actionUrl(item.link_type,item.link_value);
  return `<article class="banner-item" data-height="${esc(item.height || normalizeAppearance(state.store).banner_default_height || 'medium')}"
      style="--banner-fit:${esc(item.fit || 'cover')};--banner-position:${esc(item.object_x || 'center')} ${esc(item.object_y || 'center')};--banner-overlay:${Math.max(0,Math.min(100,Number(item.overlay||0)))/100}">
    ${media}<div class="banner-item-shade"></div>
    <div class="banner-copy" data-align="${esc(item.text_align || 'left')}">
      ${item.title?`<h2>${esc(item.title)}</h2>`:''}
      ${item.subtitle?`<p>${esc(item.subtitle)}</p>`:''}
      ${item.button_text && url ? `<a class="primary-action" href="${esc(url)}" ${item.link_target==='new'?'target="_blank" rel="noopener noreferrer"':''}>${esc(item.button_text)} <i class="ri-arrow-right-line"></i></a>`:''}
    </div>
  </article>`;
}

function renderBannerGroup(slotName, items) {
  const slot = document.querySelector(`.slot[data-slot="${slotName}"]`);
  if (!slot || !items.length) return;
  const host = slot.querySelector('.slot-inner');
  const a = normalizeAppearance(state.store), mode = a.banner_display_mode || 'carousel';
  slot.classList.add('has-content');

  if (mode === 'carousel' && items.length > 1) {
    host.innerHTML = `<div class="banner-stage mode-carousel"><div class="banner-track">${items.map(bannerItem).join('')}</div>
      ${a.banner_arrows!==false?`<div class="banner-controls"><button data-banner-prev type="button" aria-label="Anterior"><i class="ri-arrow-left-s-line"></i></button><button data-banner-next type="button" aria-label="Próximo"><i class="ri-arrow-right-s-line"></i></button></div>`:''}
      ${a.banner_dots!==false?`<div class="banner-dots">${items.map((_,i)=>`<button type="button" data-banner-dot="${i}" class="${i===0?'active':''}" aria-label="Banner ${i+1}"></button>`).join('')}</div>`:''}
    </div>`;
    initBannerCarousel(host.querySelector('.banner-stage'),items.length);
  } else {
    host.innerHTML = `<div class="banner-stage mode-${esc(mode)}">${items.map(bannerItem).join('')}</div>`;
  }
}

function initBannerCarousel(stage,count) {
  const a = normalizeAppearance(state.store);
  const track = stage.querySelector('.banner-track');
  let index=0,timer=null,paused=false;
  const go = n => {
    index = a.banner_loop === false ? Math.max(0,Math.min(count-1,n)) : (n+count)%count;
    track.style.transform=`translate3d(${-index*100}%,0,0)`;
    $$('[data-banner-dot]',stage).forEach((d,i)=>d.classList.toggle('active',i===index));
  };
  stage.querySelector('[data-banner-prev]')?.addEventListener('click',()=>go(index-1));
  stage.querySelector('[data-banner-next]')?.addEventListener('click',()=>go(index+1));
  $$('[data-banner-dot]',stage).forEach(d=>d.onclick=()=>go(Number(d.dataset.bannerDot)));
  const start = () => {
    if (a.banner_autoplay === false || count < 2) return;
    stop();
    timer=setInterval(()=>{if(!paused)go(index+1)},Math.max(2500,Number(a.banner_autoplay_delay||5000)));
  };
  const stop=()=>{if(timer)clearInterval(timer);timer=null};
  if (a.banner_pause_interaction !== false) {
    ['pointerenter','touchstart','focusin'].forEach(ev=>stage.addEventListener(ev,()=>paused=true,{passive:true}));
    ['pointerleave','touchend','focusout'].forEach(ev=>stage.addEventListener(ev,()=>paused=false,{passive:true}));
  }
  start();
  state.bannerControllers.push({stop});
}

async function loadBanners() {
  if (state.bannersLoaded) return;
  state.bannersLoaded = true;
  try {
    const {data,error}=await state.sb.from('store_banners').select('*').eq('store_id',state.store.id).order('position');
    if (error) throw error;
    const groups={after_hero:[],before_categories:[],after_categories:[],before_products:[],after_products:[],before_footer:[]};
    (data||[]).filter(bannerActiveNow).forEach(item=>{ if(groups[item.placement]) groups[item.placement].push(item); });
    Object.entries(groups).forEach(([slot,items])=>renderBannerGroup(slot,items));
  } catch(error){ console.warn('[CLENA] banners',error); }
}

function galleryItem(item,index) {
  const media = item.media_type === 'video'
    ? `<video src="${esc(item.media_url)}" muted playsinline preload="metadata"></video>`
    : `<img src="${esc(item.media_url)}" alt="${esc(item.title || 'Galeria')}" loading="lazy" decoding="async">`;
  const url=actionUrl(item.link_type,item.link_value), a=normalizeAppearance(state.store);
  return `<article class="gallery-item">
    <button class="gallery-open" type="button" data-gallery-index="${index}" ${!a.gallery_lightbox && url?`data-gallery-url="${esc(url)}"`:''}>
      <div class="gallery-media" style="--gallery-fit:${esc(item.fit||'cover')};--gallery-position:${esc(item.object_x||'center')} ${esc(item.object_y||'center')}">${media}</div>
      ${(item.title||item.description)?`<div class="gallery-copy">${item.title?`<strong>${esc(item.title)}</strong>`:''}${item.description?`<p>${esc(item.description)}</p>`:''}</div>`:''}
    </button>
  </article>`;
}

async function loadGallery() {
  if (state.galleryLoaded) return;
  state.galleryLoaded = true;
  try {
    const {data,error}=await state.sb.from('store_gallery_items').select('*').eq('store_id',state.store.id).eq('active',true).order('position').limit(60);
    if (error) throw error;
    const items=(data||[]).filter(i=>i.description!=='__CLENA_PRODUCT_MEDIA__');
    if (!items.length) return;

    const a=normalizeAppearance(state.store), slotName=a.gallery_position||'after_products';
    const slot=document.querySelector(`.slot[data-slot="${slotName}"]`);
    if(!slot)return;
    slot.classList.add('has-content');
    const host=slot.querySelector('.slot-inner');
    host.insertAdjacentHTML('beforeend',`<section class="gallery-section" id="gallerySection">
      <div class="gallery-head"><h2>${esc(a.gallery_title||'Nossa galeria')}</h2>${a.gallery_subtitle?`<p>${esc(a.gallery_subtitle)}</p>`:''}</div>
      <div class="gallery" id="galleryGrid" data-layout="${esc(a.gallery_layout||'grid')}">${items.map(galleryItem).join('')}</div>
    </section>`);
    bindGallery(items);
  } catch(error){ console.warn('[CLENA] galeria',error); }
}

function bindGallery(items) {
  $$('[data-gallery-index]',$('galleryGrid')).forEach(button=>{
    button.onclick=()=>{
      const item=items[Number(button.dataset.galleryIndex)];
      const a=normalizeAppearance(state.store);
      const url=actionUrl(item.link_type,item.link_value);
      if(a.gallery_lightbox){
        openLightbox(item);
      } else if(url) {
        if(item.link_target==='new') window.open(url,'_blank','noopener'); else location.assign(url);
      }
    };
  });
}
function openLightbox(item) {
  $('lightboxContent').innerHTML=item.media_type==='video'
    ? `<video src="${esc(item.media_url)}" controls autoplay playsinline></video>`
    : `<img src="${esc(item.media_url)}" alt="${esc(item.title||'Galeria')}">`;
  $('galleryLightbox').classList.remove('is-hidden');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  $('lightboxContent').querySelector('video')?.pause();
  $('galleryLightbox').classList.add('is-hidden');
  $('lightboxContent').innerHTML='';
  document.body.style.overflow='';
}

function setupObserver() {
  state.observer?.disconnect();
  state.observer=new IntersectionObserver(entries=>{
    if(entries.some(e=>e.isIntersecting)&&state.hasMore&&!state.loading)loadProducts();
  },{rootMargin:'700px 0px'});
  state.observer.observe($('loadSentinel'));
}

function scheduleDeferredMedia() {
  const run=()=>Promise.allSettled([loadBanners(),loadGallery()]);
  if('requestIdleCallback' in window) requestIdleCallback(run,{timeout:1300}); else setTimeout(run,300);
}

function bindUI() {
  $('productSort').onchange=()=>{
    state.sort=$('productSort').value;
    state.products=[];state.page=0;state.hasMore=true;
    updateUrlState();loadProducts({reset:true,reason:'sort'});
  };
  $('productSearch').addEventListener('input',()=>{
    const value=$('productSearch').value.trim().slice(0,80);
    $('searchControl').classList.toggle('has-value',!!value);
    clearTimeout(state.searchTimer);
    state.searchTimer=setTimeout(()=>{
      state.query=value;
      state.products=[];state.page=0;state.hasMore=true;
      updateUrlState();loadProducts({reset:true,reason:'search'});
    },280);
  });
  $('productSearch').addEventListener('search',()=>{
    if(!$('productSearch').value){state.query='';updateUrlState();loadProducts({reset:true,reason:'search'});}
  });
  $('clearSearch').onclick=()=>{
    $('productSearch').value='';$('searchControl').classList.remove('has-value');
    state.query='';updateUrlState();loadProducts({reset:true,reason:'search'});
  };
  $('loadMoreButton').onclick=()=>loadProducts();
  $('closeLightbox').onclick=closeLightbox;
  $('galleryLightbox').onclick=e=>{if(e.target===$('galleryLightbox'))closeLightbox()};
  addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('galleryLightbox').classList.contains('is-hidden'))closeLightbox()});
  $('backTop').onclick=()=>scrollTo({top:0,behavior:normalizeAppearance(state.store).scroll_behavior==='smooth'?'smooth':'auto'});
  addEventListener('scroll',()=>{
    $('backTop').classList.toggle('visible',scrollY>700);
  },{passive:true});
  addEventListener('storage',e=>{if(state.store&&e.key===cartKey())updateCartBadges()});
  addEventListener('pagehide',()=>saveViewState());
}

async function init() {
  const view=loadViewState();
  try {
    state.sb=await getDb();
    state.store=await fetchStore();
    applyAppearance(state.store,true);
    renderStoreChrome();
    bindUI();

    // Estado da URL vence o estado salvo quando o usuário chegou por um link filtrado.
    const hasExplicitState=['cat','q','sort'].some(k=>new URLSearchParams(location.search).has(k));
    if(hasExplicitState) applyUrlState();

    // Se voltou de produto, restaura o catálogo já renderizado ANTES de qualquer refresh.
    const restoredSnapshot=!hasExplicitState && restoreViewSnapshot(view);
    if(restoredSnapshot){
      restoreSavedScroll(true);
      // Atualiza categorias em background, sem desmontar os produtos que já estão na tela.
      loadCategories().catch(console.warn);
      scheduleDeferredMedia();
      setupObserver();
      return;
    }

    // Primeira visita: categorias + primeira página em paralelo.
    $('productGrid').innerHTML=skeletonCards(matchMedia('(max-width:690px)').matches?9:12);
    await Promise.all([
      loadCategories(),
      loadProducts({reset:true,reason:'initial'})
    ]);
    revealPage();
    scheduleDeferredMedia();
    setupObserver();
  } catch(error) {
    console.error('[CLENA] loja pública',error);
    delete document.documentElement.dataset.restoring;
    document.body.classList.add('page-ready');
    $('productGrid').innerHTML='';
    $('catalogEmpty').classList.remove('is-hidden');
    $('catalogEmpty').querySelector('h3').textContent='Não foi possível abrir a loja';
    $('catalogEmpty').querySelector('p').textContent=error.message||'Tente novamente em instantes.';
  }
}

addEventListener('pageshow',event=>{
  if(event.persisted){
    document.body.classList.add('page-ready');
    delete document.documentElement.dataset.restoring;
    updateCartBadges();
  }
});

init();
</script>
</body>
</html>
